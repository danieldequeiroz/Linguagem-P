<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-label="Changing the rules of a running cell without endangering people" font-size="13"><style>svg{--cds-text-primary:#0b0b0b;--cds-text-secondary:#52514e;--cds-chart-axis:#b5b4a8;--cds-chart-grid:#e1e0db;--cds-chart-reference-tint:#ededec;--cds-chart-categorical-1:#2a78d6;--cds-chart-categorical-2:#d9822b;--cds-chart-categorical-3:#7d5bc6;--cds-chart-status-warning:#e8a317;--cds-chart-status-good:#2e9d5b;--cds-chart-status-critical:#d14343;--cds-bg:#ffffff;background:var(--cds-bg);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}@media (prefers-color-scheme:dark){svg{--cds-text-primary:#ecebe7;--cds-text-secondary:#a8a49c;--cds-chart-axis:#6f6d65;--cds-chart-grid:#3a3833;--cds-chart-reference-tint:#2a2926;--cds-chart-categorical-1:#6aa5f0;--cds-chart-categorical-2:#f0a35e;--cds-chart-categorical-3:#a98cf0;--cds-chart-status-warning:#f0b23a;--cds-chart-status-good:#4cc27b;--cds-chart-status-critical:#f06a6a;--cds-bg:#1b1a18}}</style><defs><marker id="p2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="20" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">The problem: changing the rules of a running cell without endangering people</text><text x="20" y="56" font-size="11.5" font-weight="600" fill="var(--cds-text-secondary)">Physical cell (top view)</text><text x="460" y="56" font-size="11.5" font-weight="600" fill="var(--cds-text-secondary)">Regulation layer (multi-agent system)</text><g><rect x="292" y="168" width="90" height="34" fill="var(--cds-chart-reference-tint)"></rect></g><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="2"><path d="M40 70H382V168"></path><path d="M382 202V300H252"></path><path d="M188 300H40V70"></path></g><text x="48" y="88" font-size="11.5" fill="var(--cds-text-secondary)">Cell fence</text><g><circle cx="210" cy="185" r="82" fill="var(--cds-chart-categorical-1)" fill-opacity="0.08" stroke="var(--cds-chart-categorical-1)" stroke-width="1.5" stroke-dasharray="6 4"></circle><text x="210" y="126" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Work envelope</text><text x="210" y="141" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">capacity: one agent</text></g><g><circle cx="210" cy="185" r="10" fill="var(--cds-chart-axis)"></circle><path d="M210 185L246 156L274 170" fill="none" stroke="var(--cds-text-primary)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path><text x="210" y="222" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Robot arm</text><text x="210" y="237" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">agent 1</text></g><g><rect x="318" y="172" width="56" height="26" rx="4" fill="none" stroke="var(--cds-text-primary)" stroke-width="1.5"></rect><path d="M314 185H296" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#p2-arrow)"></path><text x="318" y="162" font-weight="600" fill="var(--cds-text-primary)">AGV</text><text x="318" y="216" font-size="11.5" fill="var(--cds-text-secondary)">agent 2</text></g><g><rect x="184" y="292" width="6" height="16" fill="var(--cds-chart-status-warning)"></rect><rect x="250" y="292" width="6" height="16" fill="var(--cds-chart-status-warning)"></rect><path d="M190 300H250" fill="none" stroke="var(--cds-chart-status-warning)" stroke-width="1.5" stroke-dasharray="4 3"></path><text x="178" y="318" text-anchor="end" font-size="11.5" fill="var(--cds-text-secondary)">door with light curtain</text></g><g fill="none" stroke="var(--cds-text-primary)" stroke-width="1.5"><circle cx="220" cy="326" r="7"></circle><path d="M220 333V352M208 340H232M220 352L212 366M220 352L228 366"></path></g><text x="182" y="384" font-weight="600" fill="var(--cds-text-primary)">Technician</text><g><rect x="460" y="70" width="280" height="50" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="472" y="92" font-weight="600" fill="var(--cds-text-primary)">Organization</text><text x="472" y="109" font-size="11.5" fill="var(--cds-text-secondary)">job obligations, deadlines, sanctions</text></g><g><rect x="460" y="160" width="280" height="50" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="472" y="182" font-weight="600" fill="var(--cds-text-primary)">Adaptation coordinator</text><text x="472" y="199" font-size="11.5" fill="var(--cds-text-primary)">lock-out: new norm set closes the envelope</text></g><g><rect x="460" y="250" width="280" height="50" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="472" y="272" font-weight="600" fill="var(--cds-text-primary)">Cell controller (PLC)</text><text x="472" y="289" font-size="11.5" fill="var(--cds-text-secondary)">admits or denies agents; interlocks</text></g><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M460 95H386" marker-end="url(#p2-arrow)"></path><path d="M600 210V248" marker-end="url(#p2-arrow)"></path><path d="M232 344H440V185H458" marker-end="url(#p2-arrow)"></path></g><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" stroke-dasharray="3 3"><path d="M460 270H300L282 240"></path><path d="M460 290H420V322H262"></path></g><text x="423" y="88" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">assigns jobs</text><text x="608" y="234" font-size="11.5" fill="var(--cds-text-secondary)">install new norms</text><text x="306" y="286" font-size="11.5" fill="var(--cds-text-secondary)">admit / deny</text><text x="300" y="338" font-size="11.5" fill="var(--cds-text-secondary)">requests lock-out</text><text x="238" y="364" font-size="11.5" fill="var(--cds-chart-categorical-1)">enters after commit</text><g><rect x="20" y="398" width="720" height="64" rx="8" fill="var(--cds-chart-reference-tint)" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="34" y="419" font-weight="600" fill="var(--cds-text-primary)">Safety:</text><text x="96" y="419" fill="var(--cds-text-primary)">can a person and an agent ever be in the envelope together while the norms change? (S1, S2, S4)</text><text x="34" y="437" font-weight="600" fill="var(--cds-text-primary)">Liveness:</text><text x="106" y="437" fill="var(--cds-text-primary)">is every job obligation resolved, and does every lock-out complete? (L1, L2)</text><text x="34" y="455" font-size="11.5" fill="var(--cds-text-secondary)">Both are checked with the same monitors: by the P checker on the model, and by PObserve on logs of the running cell.</text></g></svg>
