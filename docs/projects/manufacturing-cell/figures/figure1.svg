<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 428" role="img" aria-label="Manufacturing cell: shared space and regulation" font-size="13"><style>svg{--cds-text-primary:#0b0b0b;--cds-text-secondary:#52514e;--cds-chart-axis:#b5b4a8;--cds-chart-grid:#e1e0db;--cds-chart-reference-tint:#ededec;--cds-chart-categorical-1:#2a78d6;--cds-chart-categorical-2:#d9822b;--cds-chart-categorical-3:#7d5bc6;--cds-chart-status-warning:#e8a317;--cds-chart-status-good:#2e9d5b;--cds-chart-status-critical:#d14343;--cds-bg:#ffffff;background:var(--cds-bg);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}@media (prefers-color-scheme:dark){svg{--cds-text-primary:#ecebe7;--cds-text-secondary:#a8a49c;--cds-chart-axis:#6f6d65;--cds-chart-grid:#3a3833;--cds-chart-reference-tint:#2a2926;--cds-chart-categorical-1:#6aa5f0;--cds-chart-categorical-2:#f0a35e;--cds-chart-categorical-3:#a98cf0;--cds-chart-status-warning:#f0b23a;--cds-chart-status-good:#4cc27b;--cds-chart-status-critical:#f06a6a;--cds-bg:#1b1a18}}</style><g transform="scale(0.475) translate(0 -40)"><defs><marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cds-chart-status-good)"></path></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cds-chart-categorical-1)"></path></marker></defs><text x="60" y="111" fill="var(--cds-text-primary)" font-size="39" font-weight="700">Manufacturing cell: shared space and regulation</text><text x="60" y="156" fill="var(--cds-text-secondary)" font-size="23">One shared work envelope · one admission controller</text><rect x="60" y="200" width="920" height="610" rx="16" fill="none" stroke="var(--cds-chart-axis)" stroke-width="2"></rect><rect x="1010" y="200" width="530" height="610" rx="16" fill="none" stroke="var(--cds-chart-axis)" stroke-width="2"></rect><text x="90" y="245" fill="var(--cds-text-secondary)" font-size="22" font-weight="700">PHYSICAL SYSTEM</text><text x="1040" y="245" fill="var(--cds-text-secondary)" font-size="22" font-weight="700">REGULATION</text><rect x="110" y="295" width="800" height="335" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="2"></rect><rect x="160" y="340" width="450" height="245" rx="25" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2" stroke-dasharray="9 7"></rect><text x="385" y="377" fill="var(--cds-chart-categorical-1)" font-size="25" font-weight="600" text-anchor="middle">Shared work envelope</text><circle cx="285" cy="495" r="25" fill="var(--cds-chart-axis)"></circle><path d="M285,495 l65,-75 l65,35" fill="none" stroke="var(--cds-text-primary)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"></path><text x="285" y="558" fill="var(--cds-text-primary)" font-size="22" font-weight="600" text-anchor="middle">Robot arm</text><rect x="705" y="435" width="110" height="50" rx="12" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="760" y="468" fill="var(--cds-chart-categorical-1)" font-size="23" font-weight="700" text-anchor="middle">AGV</text><path d="M695,460 L625,460" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="3" marker-end="url(#arrow-accent)"></path><text x="760" y="520" fill="var(--cds-text-secondary)" font-size="22" text-anchor="middle">Requests access</text><g transform="translate(785 696)" fill="none" stroke="var(--cds-chart-status-good)" stroke-width="4" stroke-linecap="round"><circle cy="-32" r="12"></circle><path d="M0,-19 V20 M-20,0 H20 M0,20 L-19,48 M0,20 L19,48"></path></g><text x="785" y="782" fill="var(--cds-chart-status-good)" font-size="22" font-weight="600" text-anchor="middle">Technician</text><path d="M740,650 L640,600" fill="none" stroke="var(--cds-chart-status-good)" stroke-width="3" marker-end="url(#arrow-good)"></path><text x="770" y="585" fill="var(--cds-chart-status-good)" font-size="22" text-anchor="middle">After commit</text><rect x="160" y="690" width="410" height="80" rx="16" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="365" y="739" fill="var(--cds-chart-categorical-1)" font-size="25" font-weight="600" text-anchor="middle">Cell admission controller</text><path d="M365,682 L365,642" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="3" marker-end="url(#arrow-accent)"></path><rect x="1050" y="300" width="450" height="152" rx="16" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="1077" y="344" fill="var(--cds-chart-categorical-1)" font-size="27" font-weight="700">Adaptation coordinator</text><text x="1077" y="389" fill="var(--cds-text-primary)" font-size="24">Prepare → drain → commit</text><text x="1077" y="426" fill="var(--cds-text-secondary)" font-size="22">Changes the norm set</text><path d="M1050,412 L985,412" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="3" marker-end="url(#arrow-accent)"></path><text x="1048" y="492" fill="var(--cds-text-secondary)" font-size="22">Norms sent to admission controllers</text><rect x="1050" y="548" width="450" height="152" rx="16" fill="none" stroke="var(--cds-chart-axis)" stroke-width="2"></rect><text x="1077" y="593" fill="var(--cds-text-primary)" font-size="28" font-weight="700">Organization</text><text x="1077" y="635" fill="var(--cds-text-secondary)" font-size="23">Assigns tasks, tracks</text><text x="1077" y="667" fill="var(--cds-text-secondary)" font-size="23">deadlines, applies sanctions</text><text x="1275" y="758" fill="var(--cds-text-secondary)" font-size="22" font-weight="700" text-anchor="middle">CENTRAL COORDINATION</text><path d="M60,848 H1540" stroke="var(--cds-chart-axis)" stroke-width="2"></path><text x="60" y="886" fill="var(--cds-text-secondary)" font-size="22">Human entry requires committed closure and an empty shared resource; physical faults are outside this model.</text></g></svg>
