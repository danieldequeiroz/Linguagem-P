xt x="572" y="216" font-size="11.5" fill="var(--cds-text-secondary)">to the agent</text><text x="572" y="232" font-size="11.5" fill="var(--cds-text-secondary)">eSanctionApplied</text></g><g><rect x="352" y="264" width="180" height="88" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" stroke-dasharray="5 4"></rect><text x="368" y="288" font-weight="600" fill="var(--cds-text-primary)">Inactive (extension)</text><text x="368" y="304" font-size="11.5" fill="var(--cds-text-secondary)">condition stopped</text><text x="368" y="320" font-size="11.5" fill="var(--cds-text-secondary)">holding; no baseline</text><text x="368" y="336" font-size="11.5" fill="var(--cds-text-secondary)">event or handler</text></g></svg>
