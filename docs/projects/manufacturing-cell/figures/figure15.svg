s of the model only</text><circle cx="106" cy="366" r="6" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></circle><text x="118" y="370" font-size="11.5" fill="var(--cds-text-secondary)">run logged and replayed by PObserve: few, but executions of the deployed system</text></g></svg>
