<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" role="img" aria-label="Every agent action passes through one cell controller" font-size="13"><style>svg{--cds-text-primary:#0b0b0b;--cds-text-secondary:#52514e;--cds-chart-axis:#b5b4a8;--cds-chart-grid:#e1e0db;--cds-chart-reference-tint:#ededec;--cds-chart-categorical-1:#2a78d6;--cds-chart-categorical-2:#d9822b;--cds-chart-categorical-3:#7d5bc6;--cds-chart-status-warning:#e8a317;--cds-chart-status-good:#2e9d5b;--cds-chart-status-critical:#d14343;--cds-bg:#ffffff;background:var(--cds-bg);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}@media (prefers-color-scheme:dark){svg{--cds-text-primary:#ecebe7;--cds-text-secondary:#a8a49c;--cds-chart-axis:#6f6d65;--cds-chart-grid:#3a3833;--cds-chart-reference-tint:#2a2926;--cds-chart-categorical-1:#6aa5f0;--cds-chart-categorical-2:#f0a35e;--cds-chart-categorical-3:#a98cf0;--cds-chart-status-warning:#f0b23a;--cds-chart-status-good:#4cc27b;--cds-chart-status-critical:#f06a6a;--cds-bg:#1b1a18}}</style><defs><marker id="cell-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Every agent action passes through one cell controller</text><text x="24" y="114" font-size="11.5" font-weight="600" fill="var(--cds-text-secondary)">Organization</text><text x="24" y="254" font-size="11.5" font-weight="600" fill="var(--cds-text-secondary)">Environment</text><text x="24" y="402" font-size="11.5" font-weight="600" fill="var(--cds-text-secondary)">Agents</text><text x="24" y="498" font-size="11.5" font-weight="600" fill="var(--cds-text-secondary)">Monitoring</text><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M200 146V346" marker-start="url(#cell-arrow)" marker-end="url(#cell-arrow)"></path><path d="M420 286V346" marker-start="url(#cell-arrow)" marker-end="url(#cell-arrow)"></path><path d="M480 146V214" marker-start="url(#cell-arrow)" marker-end="url(#cell-arrow)"></path><path d="M680 214V110H640" marker-start="url(#cell-arrow)" marker-end="url(#cell-arrow)"></path></g><text x="192" y="306" text-anchor="end" font-size="11.5" fill="var(--cds-text-secondary)">obligations, sanctions</text><text x="192" y="322" text-anchor="end" font-size="11.5" fill="var(--cds-text-secondary)">job reports</text><text x="428" y="314" font-size="11.5" fill="var(--cds-text-secondary)">request, release / grant, deny</text><text x="472" y="178" text-anchor="end" font-size="11.5" fill="var(--cds-text-secondary)">prepare, commit</text><text x="472" y="194" text-anchor="end" font-size="11.5" fill="var(--cds-text-secondary)">ack after drain</text><text x="672" y="178" text-anchor="end" font-size="11.5" fill="var(--cds-text-secondary)">lock-out request</text><text x="672" y="194" text-anchor="end" font-size="11.5" fill="var(--cds-text-secondary)">and done</text><g><rect x="140" y="74" width="220" height="72" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="156" y="98" font-weight="600" fill="var(--cds-text-primary)">Obligation manager</text><text x="156" y="114" font-size="11.5" fill="var(--cds-text-secondary)">obligations, deadlines,</text><text x="156" y="130" font-size="11.5" fill="var(--cds-text-secondary)">sanctions</text></g><g><rect x="420" y="74" width="220" height="72" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="436" y="98" font-weight="600" fill="var(--cds-text-primary)">Adaptation coordinator</text><text x="436" y="114" font-size="11.5" fill="var(--cds-text-secondary)">detect, design, execute</text><text x="436" y="130" font-size="11.5" fill="var(--cds-text-secondary)">versioned norm sets</text></g><g><rect x="300" y="214" width="240" height="72" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="316" y="238" font-weight="600" fill="var(--cds-text-primary)">Cell controller (PLC)</text><text x="316" y="254" font-size="11.5" fill="var(--cds-text-primary)">regiments the envelope:</text><text x="316" y="270" font-size="11.5" fill="var(--cds-text-primary)">capacity 1; closed in lock-out</text></g><g><rect x="580" y="214" width="156" height="72" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="596" y="238" font-weight="600" fill="var(--cds-text-primary)">Technician</text><text x="596" y="254" font-size="11.5" fill="var(--cds-text-secondary)">requests lock-out,</text><text x="596" y="270" font-size="11.5" fill="var(--cds-text-secondary)">enters after commit</text></g><g><rect x="140" y="346" width="460" height="104" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="156" y="370" font-weight="600" fill="var(--cds-text-primary)">Agents: open system, may not comply</text><rect x="156" y="382" width="208" height="56" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="172" y="406" font-weight="600" fill="var(--cds-text-primary)">Robot arm (agent 1)</text><text x="172" y="422" font-size="11.5" fill="var(--cds-text-secondary)">may skip its job report</text><rect x="376" y="382" width="208" height="56" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="392" y="406" font-weight="600" fill="var(--cds-text-primary)">AGV (agent 2)</text><text x="392" y="422" font-size="11.5" fill="var(--cds-text-secondary)">may skip its job report</text></g><g><rect x="140" y="474" width="596" height="40" rx="8" fill="var(--cds-chart-reference-tint)" stroke="var(--cds-chart-axis)" stroke-width="1.25" stroke-dasharray="4 4"></rect><text x="438" y="499" text-anchor="middle" fill="var(--cds-text-primary)">P monitors observe events announced by every component</text></g></svg>
