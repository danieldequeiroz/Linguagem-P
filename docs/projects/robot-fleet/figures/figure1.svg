<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-label="Closing a corridor zone safely and sanctioning fairly" font-size="13"><style>svg{--cds-text-primary:#0b0b0b;--cds-text-secondary:#52514e;--cds-chart-axis:#b5b4a8;--cds-chart-grid:#e1e0db;--cds-chart-reference-tint:#ededec;--cds-chart-categorical-1:#2a78d6;--cds-chart-categorical-2:#d9822b;--cds-chart-categorical-3:#7d5bc6;--cds-chart-status-warning:#e8a317;--cds-chart-status-good:#2e9d5b;--cds-chart-status-critical:#d14343;--cds-bg:#ffffff;background:var(--cds-bg);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}@media (prefers-color-scheme:dark){svg{--cds-text-primary:#ecebe7;--cds-text-secondary:#a8a49c;--cds-chart-axis:#6f6d65;--cds-chart-grid:#3a3833;--cds-chart-reference-tint:#2a2926;--cds-chart-categorical-1:#6aa5f0;--cds-chart-categorical-2:#f0a35e;--cds-chart-categorical-3:#a98cf0;--cds-chart-status-warning:#f0b23a;--cds-chart-status-good:#4cc27b;--cds-chart-status-critical:#f06a6a;--cds-bg:#1b1a18}}</style><defs><marker id="pf2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker><marker id="pf2-arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-categorical-1)"></path></marker></defs><text x="20" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">The problem: closing a corridor zone safely and sanctioning fairly</text><text x="20" y="56" font-size="11.5" font-weight="600" fill="var(--cds-text-secondary)">Physical corridor (top view)</text><text x="460" y="56" font-size="11.5" font-weight="600" fill="var(--cds-text-secondary)">Regulation layer (multi-agent system)</text><g><rect x="150" y="120" width="120" height="80" fill="var(--cds-chart-categorical-1)" fill-opacity="0.1"></rect></g><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="2"><path d="M30 120H390"></path><path d="M30 200H60"></path><path d="M120 200H300"></path><path d="M360 200H390"></path></g><g fill="none" stroke="var(--cds-chart-status-warning)" stroke-width="1.5" stroke-dasharray="4 3"><path d="M150 120V200"></path><path d="M270 120V200"></path></g><text x="210" y="112" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">light curtains at both ends of zone 1</text><text x="38" y="138" font-size="11.5" font-weight="600" fill="var(--cds-text-secondary)">Zone 0</text><text x="158" y="138" font-size="11.5" font-weight="600" fill="var(--cds-text-secondary)">Zone 1</text><text x="278" y="138" font-size="11.5" font-weight="600" fill="var(--cds-text-secondary)">Zone 2</text><text x="210" y="152" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">one robot per zone</text><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" stroke-dasharray="3 3"><path d="M60 200V232H120V200"></path><path d="M300 200V232H360V200"></path></g><text x="90" y="226" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">side bay</text><text x="330" y="226" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">side bay</text><g><rect x="66" y="160" width="44" height="24" rx="6" fill="var(--cds-chart-categorical-2)" fill-opacity="0.2" stroke="var(--cds-chart-categorical-2)" stroke-width="1.5"></rect><text x="88" y="176" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--cds-text-primary)">R1</text><path d="M114 172H142" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#pf2-arrow)"></path></g><g><rect x="310" y="160" width="44" height="24" rx="6" fill="var(--cds-chart-categorical-3)" fill-opacity="0.2" stroke="var(--cds-chart-categorical-3)" stroke-width="1.5"></rect><text x="332" y="176" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--cds-text-primary)">R2</text><path d="M306 172H278" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#pf2-arrow)"></path></g><g fill="none" stroke="var(--cds-text-primary)" stroke-width="1.5"><circle cx="210" cy="250" r="7"></circle><path d="M210 257V276M198 264H222M210 276L202 290M210 276L218 290"></path></g><text x="228" y="268" font-weight="600" fill="var(--cds-text-primary)">Picker</text><text x="228" y="284" font-size="11.5" fill="var(--cds-text-secondary)">needs zone 1</text><g><rect x="460" y="72" width="280" height="50" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="472" y="94" font-weight="600" fill="var(--cds-text-primary)">Fleet manager (organization)</text><text x="472" y="111" font-size="11.5" fill="var(--cds-text-secondary)">deliveries with deadlines; sanctions</text></g><g><rect x="460" y="160" width="280" height="50" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="472" y="182" font-weight="600" fill="var(--cds-text-primary)">Adaptation coordinator</text><text x="472" y="199" font-size="11.5" fill="var(--cds-text-primary)">closure: a new norm set closes zone 1</text></g><g><rect x="460" y="248" width="280" height="50" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="472" y="270" font-weight="600" fill="var(--cds-text-primary)">Zone controllers 0, 1, 2</text><text x="472" y="287" font-size="11.5" fill="var(--cds-text-secondary)">each admits under its own norm version</text></g><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M460 97H332V156" marker-end="url(#pf2-arrow)"></path><path d="M600 210V246" marker-end="url(#pf2-arrow)"></path><path d="M460 273H380V204" marker-end="url(#pf2-arrow)"></path><path d="M232 304H446V185H458" marker-end="url(#pf2-arrow)"></path><path d="M210 240V204" stroke="var(--cds-chart-categorical-1)" marker-end="url(#pf2-arrow-a)"></path></g><text x="452" y="90" text-anchor="end" font-size="11.5" fill="var(--cds-text-secondary)">assigns deliveries</text><text x="608" y="233" font-size="11.5" fill="var(--cds-text-secondary)">install new norms</text><text x="384" y="266" font-size="11" fill="var(--cds-text-secondary)">admit/deny</text><text x="300" y="298" font-size="11.5" fill="var(--cds-text-secondary)">requests closure</text><text x="216" y="224" font-size="11.5" fill="var(--cds-chart-categorical-1)">after commit</text><g><rect x="20" y="324" width="720" height="92" rx="8" fill="var(--cds-chart-reference-tint)" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="34" y="346" font-weight="600" fill="var(--cds-text-primary)">Safety:</text><text x="96" y="346" fill="var(--cds-text-primary)">can a person and a robot ever share zone 1 while the norms change? (S1, S2)</text><text x="34" y="365" font-weight="600" fill="var(--cds-text-primary)">Liveness:</text><text x="106" y="365" fill="var(--cds-text-primary)">does every delivery obligation resolve, and does every closure complete? (L1, L2)</text><text x="34" y="384" font-weight="600" fill="var(--cds-text-primary)">Sanction fairness:</text><text x="168" y="384" fill="var(--cds-text-primary)">is a robot sanctioned for a delay that the closure or traffic caused? (F1)</text><text x="34" y="404" font-size="11.5" fill="var(--cds-text-secondary)">Checked with the same monitors by the P checker (model) and PObserve (logs); F1 flags candidate cases only.</text></g></svg>
