<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-label="A proposed sanction policy for a missed deadline, not implemented by F1" font-size="13"><style>svg{--cds-text-primary:#0b0b0b;--cds-text-secondary:#52514e;--cds-chart-axis:#b5b4a8;--cds-chart-grid:#e1e0db;--cds-chart-reference-tint:#ededec;--cds-chart-categorical-1:#2a78d6;--cds-chart-categorical-2:#d9822b;--cds-chart-categorical-3:#7d5bc6;--cds-chart-status-warning:#e8a317;--cds-chart-status-good:#2e9d5b;--cds-chart-status-critical:#d14343;--cds-bg:#ffffff;background:var(--cds-bg);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}@media (prefers-color-scheme:dark){svg{--cds-text-primary:#ecebe7;--cds-text-secondary:#a8a49c;--cds-chart-axis:#6f6d65;--cds-chart-grid:#3a3833;--cds-chart-reference-tint:#2a2926;--cds-chart-categorical-1:#6aa5f0;--cds-chart-categorical-2:#f0a35e;--cds-chart-categorical-3:#a98cf0;--cds-chart-status-warning:#f0b23a;--cds-chart-status-good:#4cc27b;--cds-chart-status-critical:#f06a6a;--cds-bg:#1b1a18}}</style><defs><marker id="sp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">A proposed sanction policy for a missed deadline (not implemented by F1)</text><g><rect x="24" y="64" width="112" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="36" y="88" font-weight="600" fill="var(--cds-text-primary)">Deadline</text><text x="36" y="106" font-size="11.5" fill="var(--cds-text-secondary)">missed</text></g><g><rect x="164" y="64" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="176" y="88" font-weight="600" fill="var(--cds-text-primary)">Cause established</text><text x="176" y="106" font-size="11.5" fill="var(--cds-text-secondary)">by adequate evidence?</text></g><g><rect x="352" y="64" width="176" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="364" y="88" font-weight="600" fill="var(--cds-text-primary)">Denied: zone closed</text><text x="364" y="106" font-size="11.5" fill="var(--cds-text-secondary)">for a person?</text></g><g><rect x="560" y="64" width="176" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="572" y="88" font-weight="600" fill="var(--cds-text-primary)">Denied: zone held</text><text x="572" y="106" font-size="11.5" fill="var(--cds-text-secondary)">by another robot?</text></g><g><rect x="164" y="184" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="176" y="208" font-weight="600" fill="var(--cds-text-primary)">Investigate</text><text x="176" y="226" font-size="11.5" fill="var(--cds-text-secondary)">no sanction yet</text></g><g><rect x="352" y="184" width="176" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="364" y="208" font-weight="600" fill="var(--cds-text-primary)">Excuse</text><text x="364" y="226" font-size="11.5" fill="var(--cds-text-secondary)">delay caused by regulation</text></g><g><rect x="560" y="184" width="176" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="572" y="208" font-weight="600" fill="var(--cds-text-primary)">Excuse or replan</text><text x="572" y="226" font-size="11.5" fill="var(--cds-text-secondary)">traffic: a policy choice</text></g><g><rect x="560" y="290" width="176" height="56" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.14" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="572" y="314" font-weight="600" fill="var(--cds-text-primary)">Sanction</text><text x="572" y="332" font-size="11.5" fill="var(--cds-text-primary)">the robot&#x27;s own conduct</text></g><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M136 92H162" marker-end="url(#sp-arrow)"></path><path d="M324 92H350" marker-end="url(#sp-arrow)"></path><path d="M528 92H558" marker-end="url(#sp-arrow)"></path><path d="M244 120V182" marker-end="url(#sp-arrow)"></path><path d="M440 120V182" marker-end="url(#sp-arrow)"></path><path d="M648 120V182" marker-end="url(#sp-arrow)"></path><path d="M736 92H748V318H738" marker-end="url(#sp-arrow)"></path></g><text x="337" y="84" font-size="11.5" text-anchor="middle" fill="var(--cds-text-secondary)">yes</text><text x="543" y="84" font-size="11.5" text-anchor="middle" fill="var(--cds-text-secondary)">no</text><text x="252" y="156" font-size="11.5" fill="var(--cds-text-secondary)">no</text><text x="448" y="156" font-size="11.5" fill="var(--cds-text-secondary)">yes</text><text x="656" y="156" font-size="11.5" fill="var(--cds-text-secondary)">yes</text><text x="744" y="270" font-size="11.5" text-anchor="end" fill="var(--cds-text-secondary)">no</text><text x="24" y="374" font-size="11.5" fill="var(--cds-text-secondary)">F1 flags a sanction on an obligation that was abandoned after repeated denials. It does not establish why access</text><text x="24" y="392" font-size="11.5" fill="var(--cds-text-secondary)">was denied, nor that the denials caused the missed deadline; a policy like this one needs that evidence.</text></svg>
