<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 428" role="img" aria-label="Robot fleet: shared space and regulation" font-size="13"><style>svg{--cds-text-primary:#0b0b0b;--cds-text-secondary:#52514e;--cds-chart-axis:#b5b4a8;--cds-chart-grid:#e1e0db;--cds-chart-reference-tint:#ededec;--cds-chart-categorical-1:#2a78d6;--cds-chart-categorical-2:#d9822b;--cds-chart-categorical-3:#7d5bc6;--cds-chart-status-warning:#e8a317;--cds-chart-status-good:#2e9d5b;--cds-chart-status-critical:#d14343;--cds-bg:#ffffff;background:var(--cds-bg);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}@media (prefers-color-scheme:dark){svg{--cds-text-primary:#ecebe7;--cds-text-secondary:#a8a49c;--cds-chart-axis:#6f6d65;--cds-chart-grid:#3a3833;--cds-chart-reference-tint:#2a2926;--cds-chart-categorical-1:#6aa5f0;--cds-chart-categorical-2:#f0a35e;--cds-chart-categorical-3:#a98cf0;--cds-chart-status-warning:#f0b23a;--cds-chart-status-good:#4cc27b;--cds-chart-status-critical:#f06a6a;--cds-bg:#1b1a18}}</style><g transform="scale(0.475) translate(0 -40)"><defs><marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cds-chart-status-good)"></path></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cds-chart-categorical-1)"></path></marker></defs><text x="60" y="111" fill="var(--cds-text-primary)" font-size="39" font-weight="700">Robot fleet: shared space and regulation</text><text x="60" y="156" fill="var(--cds-text-secondary)" font-size="23">Distributed admission · centralized adaptation and sanctioning</text><rect x="60" y="200" width="920" height="610" rx="16" fill="none" stroke="var(--cds-chart-axis)" stroke-width="2"></rect><rect x="1010" y="200" width="530" height="610" rx="16" fill="none" stroke="var(--cds-chart-axis)" stroke-width="2"></rect><text x="90" y="245" fill="var(--cds-text-secondary)" font-size="22" font-weight="700">PHYSICAL SYSTEM</text><text x="1040" y="245" fill="var(--cds-text-secondary)" font-size="22" font-weight="700">REGULATION</text><rect x="100" y="390" width="266" height="145" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="2"></rect><text x="235" y="422" fill="var(--cds-text-secondary)" font-size="25" font-weight="600" text-anchor="middle">Zone 0</text><rect x="370" y="390" width="266" height="145" rx="8" fill="var(--cds-chart-status-good)" fill-opacity="0.12" stroke="var(--cds-chart-status-good)" stroke-width="2"></rect><text x="505" y="422" fill="var(--cds-text-secondary)" font-size="25" font-weight="600" text-anchor="middle">Zone 1</text><rect x="640" y="390" width="266" height="145" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="2"></rect><text x="775" y="422" fill="var(--cds-text-secondary)" font-size="25" font-weight="600" text-anchor="middle">Zone 2</text><path d="M368.0,390 V535 M638.0,390 V535" stroke="var(--cds-chart-status-warning)" stroke-width="3" stroke-dasharray="8 6"></path><rect x="165" y="450" width="70" height="50" rx="12" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="200" y="483" fill="var(--cds-chart-categorical-1)" font-size="23" font-weight="700" text-anchor="middle">R1</text><path d="M245,475 L310,475" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="3" marker-end="url(#arrow-accent)"></path><rect x="775" y="450" width="70" height="50" rx="12" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="810" y="483" fill="var(--cds-chart-categorical-1)" font-size="23" font-weight="700" text-anchor="middle">R2</text><path d="M765,475 L700,475" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="3" marker-end="url(#arrow-accent)"></path><g transform="translate(505 295)" fill="none" stroke="var(--cds-chart-status-good)" stroke-width="4" stroke-linecap="round"><circle cy="-32" r="12"></circle><path d="M0,-19 V20 M-20,0 H20 M0,20 L-19,48 M0,20 L19,48"></path></g><text x="565" y="290" fill="var(--cds-text-primary)" font-size="23">Picker requests zone 1</text><path d="M505,350 L505,385" fill="none" stroke="var(--cds-chart-status-good)" stroke-width="3" marker-end="url(#arrow-good)"></path><text x="505" y="578" fill="var(--cds-chart-status-good)" font-size="22" font-weight="600" text-anchor="middle">Entry only after closure is committed</text><rect x="100" y="675" width="250" height="76" rx="16" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="225" y="721" fill="var(--cds-chart-categorical-1)" font-size="23" font-weight="600" text-anchor="middle">Zone controller 0</text><path d="M225,668 L225,610" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="3" marker-end="url(#arrow-accent)"></path><rect x="370" y="675" width="250" height="76" rx="16" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="495" y="721" fill="var(--cds-chart-categorical-1)" font-size="23" font-weight="600" text-anchor="middle">Zone controller 1</text><path d="M495,668 L495,610" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="3" marker-end="url(#arrow-accent)"></path><rect x="640" y="675" width="250" height="76" rx="16" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="765" y="721" fill="var(--cds-chart-categorical-1)" font-size="23" font-weight="600" text-anchor="middle">Zone controller 2</text><path d="M765,668 L765,610" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="3" marker-end="url(#arrow-accent)"></path><text x="500" y="790" fill="var(--cds-text-secondary)" font-size="22" text-anchor="middle">Capacity: one robot per zone</text><rect x="1050" y="300" width="450" height="152" rx="16" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="1077" y="344" fill="var(--cds-chart-categorical-1)" font-size="27" font-weight="700">Adaptation coordinator</text><text x="1077" y="389" fill="var(--cds-text-primary)" font-size="24">Prepare → drain → commit</text><text x="1077" y="426" fill="var(--cds-text-secondary)" font-size="22">Changes the norm set</text><path d="M1050,412 L985,412" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="3" marker-end="url(#arrow-accent)"></path><text x="1048" y="492" fill="var(--cds-text-secondary)" font-size="22">Norms sent to admission controllers</text><rect x="1050" y="548" width="450" height="152" rx="16" fill="none" stroke="var(--cds-chart-axis)" stroke-width="2"></rect><text x="1077" y="593" fill="var(--cds-text-primary)" font-size="28" font-weight="700">Fleet manager</text><text x="1077" y="635" fill="var(--cds-text-secondary)" font-size="23">Assigns tasks, tracks</text><text x="1077" y="667" fill="var(--cds-text-secondary)" font-size="23">deadlines, applies sanctions</text><text x="1275" y="758" fill="var(--cds-text-secondary)" font-size="22" font-weight="700" text-anchor="middle">CENTRAL COORDINATION</text><path d="M60,848 H1540" stroke="var(--cds-chart-axis)" stroke-width="2"></path><text x="60" y="886" fill="var(--cds-text-secondary)" font-size="22">Human entry requires committed closure and an empty shared resource; physical faults are outside this model.</text></g></svg>
