<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 428" role="img" aria-label="Robot fleet: closing zone 1 safely" font-size="13"><style>svg{--cds-text-primary:#0b0b0b;--cds-text-secondary:#52514e;--cds-chart-axis:#b5b4a8;--cds-chart-grid:#e1e0db;--cds-chart-reference-tint:#ededec;--cds-chart-categorical-1:#2a78d6;--cds-chart-categorical-2:#d9822b;--cds-chart-categorical-3:#7d5bc6;--cds-chart-status-warning:#e8a317;--cds-chart-status-good:#2e9d5b;--cds-chart-status-critical:#d14343;--cds-bg:#ffffff;background:var(--cds-bg);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}@media (prefers-color-scheme:dark){svg{--cds-text-primary:#ecebe7;--cds-text-secondary:#a8a49c;--cds-chart-axis:#6f6d65;--cds-chart-grid:#3a3833;--cds-chart-reference-tint:#2a2926;--cds-chart-categorical-1:#6aa5f0;--cds-chart-categorical-2:#f0a35e;--cds-chart-categorical-3:#a98cf0;--cds-chart-status-warning:#f0b23a;--cds-chart-status-good:#4cc27b;--cds-chart-status-critical:#f06a6a;--cds-bg:#1b1a18}}</style><g transform="scale(0.475) translate(0 -40)"><defs><marker id="arrow-quiet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cds-text-secondary)"></path></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cds-chart-categorical-1)"></path></marker></defs><text x="60" y="111" fill="var(--cds-text-primary)" font-size="39" font-weight="700">Robot fleet: closing zone 1 safely</text><text x="60" y="156" fill="var(--cds-text-secondary)" font-size="23">A conceptual sequence for the prepare–drain–commit protocol</text><rect x="60" y="215" width="340" height="575" rx="16" fill="none" stroke="var(--cds-chart-axis)" stroke-width="2"></rect><rect x="82" y="240" width="52" height="45" rx="12" fill="var(--cds-chart-categorical-1)" fill-opacity="0.15" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="108" y="272" fill="var(--cds-chart-categorical-1)" font-size="25" font-weight="700" text-anchor="middle">1</text><text x="82" y="329" fill="var(--cds-text-primary)" font-size="25" font-weight="700">Request closure</text><rect x="82" y="380" width="94.66666666666667" height="148" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="2"></rect><text x="131.33333333333334" y="412" fill="var(--cds-text-secondary)" font-size="22" font-weight="600" text-anchor="middle">Zone 0</text><rect x="180.66666666666669" y="380" width="94.66666666666667" height="148" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="2"></rect><text x="230.00000000000003" y="412" fill="var(--cds-text-secondary)" font-size="22" font-weight="600" text-anchor="middle">Zone 1</text><rect x="279.33333333333337" y="380" width="94.66666666666667" height="148" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="2"></rect><text x="328.6666666666667" y="412" fill="var(--cds-text-secondary)" font-size="22" font-weight="600" text-anchor="middle">Zone 2</text><rect x="204" y="447" width="52" height="50" rx="12" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="230" y="480" fill="var(--cds-chart-categorical-1)" font-size="23" font-weight="700" text-anchor="middle">R</text><text x="84" y="625" fill="var(--cds-text-secondary)" font-size="23">The person asks the</text><text x="84" y="657" fill="var(--cds-text-secondary)" font-size="23">coordinator to close the</text><text x="84" y="689" fill="var(--cds-text-secondary)" font-size="23">shared resource.</text><path d="M405,499 L434,499" fill="none" stroke="var(--cds-text-secondary)" stroke-width="3" marker-end="url(#arrow-quiet)"></path><rect x="440" y="215" width="340" height="575" rx="16" fill="none" stroke="var(--cds-chart-axis)" stroke-width="2"></rect><rect x="462" y="240" width="52" height="45" rx="12" fill="var(--cds-chart-categorical-1)" fill-opacity="0.15" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="488" y="272" fill="var(--cds-chart-categorical-1)" font-size="25" font-weight="700" text-anchor="middle">2</text><text x="462" y="329" fill="var(--cds-text-primary)" font-size="25" font-weight="700">Block new entries</text><rect x="462" y="380" width="94.66666666666667" height="148" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="2"></rect><text x="511.3333333333333" y="412" fill="var(--cds-text-secondary)" font-size="22" font-weight="600" text-anchor="middle">Zone 0</text><rect x="560.6666666666666" y="380" width="94.66666666666667" height="148" rx="8" fill="var(--cds-chart-status-good)" fill-opacity="0.12" stroke="var(--cds-chart-status-good)" stroke-width="2"></rect><text x="610" y="412" fill="var(--cds-text-secondary)" font-size="22" font-weight="600" text-anchor="middle">Zone 1</text><rect x="659.3333333333334" y="380" width="94.66666666666667" height="148" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="2"></rect><text x="708.6666666666667" y="412" fill="var(--cds-text-secondary)" font-size="22" font-weight="600" text-anchor="middle">Zone 2</text><path d="M558.6666666666666,380 V528 M657.3333333333334,380 V528" stroke="var(--cds-chart-status-warning)" stroke-width="3" stroke-dasharray="8 6"></path><rect x="584" y="447" width="52" height="50" rx="12" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="610" y="480" fill="var(--cds-chart-categorical-1)" font-size="23" font-weight="700" text-anchor="middle">R</text><text x="610" y="567" fill="var(--cds-chart-status-critical)" font-size="22" font-weight="700" text-anchor="middle">NO NEW ADMISSIONS</text><text x="464" y="625" fill="var(--cds-text-secondary)" font-size="23">The affected controller</text><text x="464" y="657" fill="var(--cds-text-secondary)" font-size="23">denies new admissions</text><text x="464" y="689" fill="var(--cds-text-secondary)" font-size="23">while an agent may still</text><text x="464" y="721" fill="var(--cds-text-secondary)" font-size="23">be inside.</text><path d="M785,499 L814,499" fill="none" stroke="var(--cds-text-secondary)" stroke-width="3" marker-end="url(#arrow-quiet)"></path><rect x="820" y="215" width="340" height="575" rx="16" fill="none" stroke="var(--cds-chart-axis)" stroke-width="2"></rect><rect x="842" y="240" width="52" height="45" rx="12" fill="var(--cds-chart-categorical-1)" fill-opacity="0.15" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="868" y="272" fill="var(--cds-chart-categorical-1)" font-size="25" font-weight="700" text-anchor="middle">3</text><text x="842" y="329" fill="var(--cds-text-primary)" font-size="25" font-weight="700">Drain the resource</text><rect x="842" y="380" width="94.66666666666667" height="148" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="2"></rect><text x="891.3333333333334" y="412" fill="var(--cds-text-secondary)" font-size="22" font-weight="600" text-anchor="middle">Zone 0</text><rect x="940.6666666666666" y="380" width="94.66666666666667" height="148" rx="8" fill="var(--cds-chart-status-good)" fill-opacity="0.12" stroke="var(--cds-chart-status-good)" stroke-width="2"></rect><text x="990" y="412" fill="var(--cds-text-secondary)" font-size="22" font-weight="600" text-anchor="middle">Zone 1</text><rect x="1039.3333333333333" y="380" width="94.66666666666667" height="148" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="2"></rect><text x="1088.6666666666665" y="412" fill="var(--cds-text-secondary)" font-size="22" font-weight="600" text-anchor="middle">Zone 2</text><path d="M938.6666666666666,380 V528 M1037.3333333333333,380 V528" stroke="var(--cds-chart-status-warning)" stroke-width="3" stroke-dasharray="8 6"></path><rect x="1064" y="447" width="52" height="50" rx="12" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="1090" y="480" fill="var(--cds-chart-categorical-1)" font-size="23" font-weight="700" text-anchor="middle">R</text><path d="M980,474 L1043,474" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="3" marker-end="url(#arrow-accent)"></path><text x="990" y="567" fill="var(--cds-chart-status-good)" font-size="22" font-weight="700" text-anchor="middle">EMPTY / ACKNOWLEDGED</text><text x="844" y="625" fill="var(--cds-text-secondary)" font-size="23">The occupying agent</text><text x="844" y="657" fill="var(--cds-text-secondary)" font-size="23">leaves. The affected</text><text x="844" y="689" fill="var(--cds-text-secondary)" font-size="23">controller acknowledges</text><text x="844" y="721" fill="var(--cds-text-secondary)" font-size="23">preparation.</text><path d="M1165,499 L1194,499" fill="none" stroke="var(--cds-text-secondary)" stroke-width="3" marker-end="url(#arrow-quiet)"></path><rect x="1200" y="215" width="340" height="575" rx="16" fill="none" stroke="var(--cds-chart-status-good)" stroke-width="2"></rect><rect x="1222" y="240" width="52" height="45" rx="12" fill="var(--cds-chart-status-good)" fill-opacity="0.15" stroke="var(--cds-chart-status-good)" stroke-width="2"></rect><text x="1248" y="272" fill="var(--cds-chart-status-good)" font-size="25" font-weight="700" text-anchor="middle">4</text><text x="1222" y="329" fill="var(--cds-text-primary)" font-size="25" font-weight="700">Commit, then enter</text><rect x="1222" y="380" width="94.66666666666667" height="148" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="2"></rect><text x="1271.3333333333333" y="412" fill="var(--cds-text-secondary)" font-size="22" font-weight="600" text-anchor="middle">Zone 0</text><rect x="1320.6666666666667" y="380" width="94.66666666666667" height="148" rx="8" fill="var(--cds-chart-status-good)" fill-opacity="0.12" stroke="var(--cds-chart-status-good)" stroke-width="2"></rect><text x="1370" y="412" fill="var(--cds-text-secondary)" font-size="22" font-weight="600" text-anchor="middle">Zone 1</text><rect x="1419.3333333333333" y="380" width="94.66666666666667" height="148" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="2"></rect><text x="1468.6666666666665" y="412" fill="var(--cds-text-secondary)" font-size="22" font-weight="600" text-anchor="middle">Zone 2</text><path d="M1318.6666666666667,380 V528 M1417.3333333333333,380 V528" stroke="var(--cds-chart-status-warning)" stroke-width="3" stroke-dasharray="8 6"></path><g transform="translate(1370 462) scale(0.65)" fill="none" stroke="var(--cds-chart-status-good)" stroke-width="4" stroke-linecap="round"><circle cy="-32" r="12"></circle><path d="M0,-19 V20 M-20,0 H20 M0,20 L-19,48 M0,20 L19,48"></path></g><text x="1370" y="567" fill="var(--cds-chart-status-good)" font-size="22" font-weight="700" text-anchor="middle">CLOSURE COMMITTED</text><text x="1224" y="625" fill="var(--cds-text-secondary)" font-size="23">The coordinator commits</text><text x="1224" y="657" fill="var(--cds-text-secondary)" font-size="23">closure and notifies the</text><text x="1224" y="689" fill="var(--cds-text-secondary)" font-size="23">requester. The person may</text><text x="1224" y="721" fill="var(--cds-text-secondary)" font-size="23">enter.</text><path d="M60,848 H1540" stroke="var(--cds-chart-axis)" stroke-width="2"></path><text x="60" y="886" fill="var(--cds-text-secondary)" font-size="22">Unaffected zone controllers may continue serving. The drawings show the affected resource; the diagram abstracts message</text><text x="60" y="914" fill="var(--cds-text-secondary)" font-size="22">delays and does not show coordinator failures.</text></g></svg>
