<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-label="The regulation layer stands between autonomous robots and the shared corridor" font-size="13"><style>svg{--cds-text-primary:#0b0b0b;--cds-text-secondary:#52514e;--cds-chart-axis:#b5b4a8;--cds-chart-grid:#e1e0db;--cds-chart-reference-tint:#ededec;--cds-chart-categorical-1:#2a78d6;--cds-chart-categorical-2:#d9822b;--cds-chart-categorical-3:#7d5bc6;--cds-chart-status-warning:#e8a317;--cds-chart-status-good:#2e9d5b;--cds-chart-status-critical:#d14343;--cds-bg:#ffffff;background:var(--cds-bg);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}@media (prefers-color-scheme:dark){svg{--cds-text-primary:#ecebe7;--cds-text-secondary:#a8a49c;--cds-chart-axis:#6f6d65;--cds-chart-grid:#3a3833;--cds-chart-reference-tint:#2a2926;--cds-chart-categorical-1:#6aa5f0;--cds-chart-categorical-2:#f0a35e;--cds-chart-categorical-3:#a98cf0;--cds-chart-status-warning:#f0b23a;--cds-chart-status-good:#4cc27b;--cds-chart-status-critical:#f06a6a;--cds-bg:#1b1a18}}</style><defs><marker id="rl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="var(--cds-text-primary)">The regulation layer stands between autonomous robots and the shared corridor</text><text x="24" y="50" font-size="11.5" fill="var(--cds-text-secondary)">Agents decide for themselves; the regulation layer decides what is admitted, what is sanctioned, and when the rules change</text><g><rect x="24" y="68" width="712" height="86" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="40" y="92" font-weight="600" fill="var(--cds-text-primary)">Robots (open system)</text><text x="40" y="110" font-size="11.5" fill="var(--cds-text-secondary)">autonomous; may fail to comply</text><rect x="300" y="82" width="190" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="395" y="106" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Robot R1</text><text x="395" y="124" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">deliveries 0 → 1 → 2</text><rect x="514" y="82" width="206" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="617" y="106" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Robot R2</text><text x="617" y="124" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">deliveries 2 → 1 → 0</text></g><g><rect x="24" y="186" width="712" height="196" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.06" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="40" y="210" font-weight="600" fill="var(--cds-text-primary)">Regulation layer</text><text x="40" y="228" font-size="11.5" fill="var(--cds-text-secondary)">the object of design and verification in this project</text><rect x="40" y="244" width="160" height="122" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="56" y="268" font-weight="600" fill="var(--cds-text-primary)">Represent</text><text x="56" y="288" font-size="11.5" fill="var(--cds-text-primary)">norm set, version v</text><text x="56" y="306" font-size="11.5" fill="var(--cds-text-secondary)">obligations: deliver</text><text x="56" y="322" font-size="11.5" fill="var(--cds-text-secondary)">on time; prohibitions:</text><text x="56" y="338" font-size="11.5" fill="var(--cds-text-secondary)">enter a closed zone</text><rect x="216" y="244" width="160" height="122" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="232" y="268" font-weight="600" fill="var(--cds-text-primary)">Monitor</text><text x="232" y="288" font-size="11.5" fill="var(--cds-text-secondary)">observe entries, leaves,</text><text x="232" y="304" font-size="11.5" fill="var(--cds-text-secondary)">reports and deadlines;</text><text x="232" y="320" font-size="11.5" fill="var(--cds-text-secondary)">detect violations</text><rect x="392" y="244" width="160" height="122" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="408" y="268" font-weight="600" fill="var(--cds-text-primary)">Enforce</text><text x="408" y="288" font-size="11.5" fill="var(--cds-text-primary)">regiment: a controller</text><text x="408" y="304" font-size="11.5" fill="var(--cds-text-primary)">denies the action</text><text x="408" y="324" font-size="11.5" fill="var(--cds-text-secondary)">sanction: the fleet</text><text x="408" y="340" font-size="11.5" fill="var(--cds-text-secondary)">manager reacts later</text><rect x="568" y="244" width="152" height="122" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="584" y="268" font-weight="600" fill="var(--cds-text-primary)">Adapt</text><text x="584" y="288" font-size="11.5" fill="var(--cds-text-secondary)">change the norm set</text><text x="584" y="304" font-size="11.5" fill="var(--cds-text-secondary)">while the fleet runs:</text><text x="584" y="320" font-size="11.5" fill="var(--cds-text-primary)">v → v + 1 (closure)</text></g><g><rect x="24" y="414" width="712" height="76" rx="8" fill="var(--cds-chart-reference-tint)" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="40" y="438" font-weight="600" fill="var(--cds-text-primary)">Shared physical corridor</text><text x="40" y="456" font-size="11.5" fill="var(--cds-text-secondary)">outside the MAS</text><text x="300" y="438" fill="var(--cds-text-primary)">zones 0, 1, 2: one robot per zone</text><text x="300" y="458" fill="var(--cds-text-primary)">picker: enters zone 1 only after a committed closure</text><text x="300" y="478" font-size="11.5" fill="var(--cds-text-secondary)">three zone controllers execute admit and deny</text></g><g fill="none" stroke-width="1.25"><path d="M395 138V184" stroke="var(--cds-chart-axis)" marker-end="url(#rl-arrow)"></path><path d="M617 184V140" stroke="var(--cds-chart-axis)" marker-end="url(#rl-arrow)"></path><path d="M472 366V412" stroke="var(--cds-chart-axis)" marker-end="url(#rl-arrow)"></path><path d="M644 412V368" stroke="var(--cds-chart-axis)" marker-end="url(#rl-arrow)"></path></g><text x="387" y="166" text-anchor="end" font-size="11.5" fill="var(--cds-text-secondary)">request zones, report deliveries</text><text x="609" y="166" text-anchor="end" font-size="11.5" fill="var(--cds-text-secondary)">grant, deny, sanction</text><text x="464" y="394" text-anchor="end" font-size="11.5" fill="var(--cds-text-secondary)">admit or deny</text><text x="636" y="394" text-anchor="end" font-size="11.5" fill="var(--cds-text-secondary)">closure request</text><g><rect x="24" y="508" width="712" height="40" rx="8" fill="none" stroke="var(--cds-chart-status-good)" stroke-width="1.25" stroke-dasharray="5 4"></rect><text x="40" y="533" font-weight="600" fill="var(--cds-text-primary)">Verification target:</text><text x="182" y="533" font-size="11.5" fill="var(--cds-text-primary)">P monitors observe the layer, outside its control path: the checker on the model, PObserve on logs</text></g></svg>
