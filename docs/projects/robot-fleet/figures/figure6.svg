<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 272" role="img" aria-label="A BDI agent re-decides at every cycle, so compliance is never hard-wired" font-size="13"><style>svg{--cds-text-primary:#0b0b0b;--cds-text-secondary:#52514e;--cds-chart-axis:#b5b4a8;--cds-chart-grid:#e1e0db;--cds-chart-reference-tint:#ededec;--cds-chart-categorical-1:#2a78d6;--cds-chart-categorical-2:#d9822b;--cds-chart-categorical-3:#7d5bc6;--cds-chart-status-warning:#e8a317;--cds-chart-status-good:#2e9d5b;--cds-chart-status-critical:#d14343;--cds-bg:#ffffff;background:var(--cds-bg);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}@media (prefers-color-scheme:dark){svg{--cds-text-primary:#ecebe7;--cds-text-secondary:#a8a49c;--cds-chart-axis:#6f6d65;--cds-chart-grid:#3a3833;--cds-chart-reference-tint:#2a2926;--cds-chart-categorical-1:#6aa5f0;--cds-chart-categorical-2:#f0a35e;--cds-chart-categorical-3:#a98cf0;--cds-chart-status-warning:#f0b23a;--cds-chart-status-good:#4cc27b;--cds-chart-status-critical:#f06a6a;--cds-bg:#1b1a18}}</style><defs><marker id="bdi-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">A BDI agent re-decides at every cycle, so compliance is never hard-wired</text><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M174 116H210" marker-end="url(#bdi-arrow)"></path><path d="M360 116H396" marker-end="url(#bdi-arrow)"></path><path d="M546 116H582" marker-end="url(#bdi-arrow)"></path><path d="M657 88V64H99V88" marker-end="url(#bdi-arrow)"></path></g><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" stroke-dasharray="3 3"><path d="M99 144V192"></path><path d="M285 144V192"></path><path d="M471 144V192"></path></g><text x="378" y="58" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">repeat every cycle</text><g><rect x="24" y="88" width="150" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="99" y="110" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Perceive</text><text x="99" y="128" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">percepts, messages</text></g><g><rect x="210" y="88" width="150" height="56" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="285" y="110" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Deliberate</text><text x="285" y="128" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">goals to intentions</text></g><g><rect x="396" y="88" width="150" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="471" y="110" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Select plan</text><text x="471" y="128" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">trigger + context</text></g><g><rect x="582" y="88" width="150" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="657" y="110" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Act</text><text x="657" y="128" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">run one plan step</text></g><g><rect x="24" y="192" width="336" height="56" rx="8" fill="var(--cds-chart-reference-tint)" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="40" y="214" font-weight="600" fill="var(--cds-text-primary)">Belief base</text><text x="40" y="232" font-size="11.5" fill="var(--cds-text-secondary)">e.g. at(zone0), denials(2)</text></g><g><rect x="396" y="192" width="336" height="56" rx="8" fill="var(--cds-chart-reference-tint)" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="412" y="214" font-weight="600" fill="var(--cds-text-primary)">Plan library</text><text x="412" y="232" font-size="11.5" fill="var(--cds-text-secondary)">plans such as +!deliver(Path)</text></g></svg>
