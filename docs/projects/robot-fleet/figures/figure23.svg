<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 346" role="img" aria-label="Head-on robots form a wait-for cycle" font-size="13"><style>svg{--cds-text-primary:#0b0b0b;--cds-text-secondary:#52514e;--cds-chart-axis:#b5b4a8;--cds-chart-grid:#e1e0db;--cds-chart-reference-tint:#ededec;--cds-chart-categorical-1:#2a78d6;--cds-chart-categorical-2:#d9822b;--cds-chart-categorical-3:#7d5bc6;--cds-chart-status-warning:#e8a317;--cds-chart-status-good:#2e9d5b;--cds-chart-status-critical:#d14343;--cds-bg:#ffffff;background:var(--cds-bg);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}@media (prefers-color-scheme:dark){svg{--cds-text-primary:#ecebe7;--cds-text-secondary:#a8a49c;--cds-chart-axis:#6f6d65;--cds-chart-grid:#3a3833;--cds-chart-reference-tint:#2a2926;--cds-chart-categorical-1:#6aa5f0;--cds-chart-categorical-2:#f0a35e;--cds-chart-categorical-3:#a98cf0;--cds-chart-status-warning:#f0b23a;--cds-chart-status-good:#4cc27b;--cds-chart-status-critical:#f06a6a;--cds-bg:#1b1a18}}</style><defs><marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-categorical-1)"></path></marker></defs><text x="20" y="26" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Corridor deadlock and its resolution strategies</text><text x="20" y="54" font-size="11.5" font-weight="600" fill="var(--cds-text-secondary)">Circular wait in the corridor</text><text x="450" y="54" font-size="11.5" font-weight="600" fill="var(--cds-text-secondary)">Resolution strategies (Coffman condition removed)</text><g><rect x="30" y="70" width="110" height="84" rx="6" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="40" y="88" font-size="11.5" font-weight="600" fill="var(--cds-text-secondary)">Zone 0</text></g><g><rect x="150" y="70" width="110" height="84" rx="6" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="160" y="88" font-size="11.5" font-weight="600" fill="var(--cds-text-secondary)">Zone 1</text></g><g><rect x="270" y="70" width="110" height="84" rx="6" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="280" y="88" font-size="11.5" font-weight="600" fill="var(--cds-text-secondary)">Zone 2</text></g><g><circle cx="205" cy="112" r="17" fill="var(--cds-chart-categorical-1)" fill-opacity="0.14" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></circle><text x="205" y="117" font-size="12" font-weight="600" text-anchor="middle" fill="var(--cds-text-primary)">R1</text><text x="205" y="146" font-size="11" text-anchor="middle" fill="var(--cds-text-secondary)">heading right</text></g><g><circle cx="325" cy="112" r="17" fill="var(--cds-chart-categorical-1)" fill-opacity="0.14" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></circle><text x="325" y="117" font-size="12" font-weight="600" text-anchor="middle" fill="var(--cds-text-primary)">R2</text><text x="325" y="146" font-size="11" text-anchor="middle" fill="var(--cds-text-secondary)">heading left</text></g><g><circle cx="120" cy="262" r="24" fill="none" stroke="var(--cds-text-primary)" stroke-width="1.5"></circle><circle cx="320" cy="262" r="24" fill="none" stroke="var(--cds-text-primary)" stroke-width="1.5"></circle><text x="120" y="267" font-size="12" font-weight="600" text-anchor="middle" fill="var(--cds-text-primary)">R1</text><text x="320" y="267" font-size="12" font-weight="600" text-anchor="middle" fill="var(--cds-text-primary)">R2</text><path d="M142 252C200 214 240 214 298 252" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="1.5" marker-end="url(#ahA)"></path><path d="M298 272C240 310 200 310 142 272" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="1.5" marker-end="url(#ahA)"></path><text x="220" y="206" font-size="11.5" text-anchor="middle" fill="var(--cds-text-secondary)">R1 waits for zone 2, held by R2</text><text x="220" y="330" font-size="11.5" text-anchor="middle" fill="var(--cds-text-secondary)">R2 waits for zone 1, held by R1</text><text x="220" y="266" font-size="11.5" font-weight="600" text-anchor="middle" fill="var(--cds-chart-categorical-1)">wait-for cycle</text></g><g><rect x="450" y="70" width="290" height="72" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="462" y="92" font-weight="600" fill="var(--cds-text-primary)">Voluntary release (no preemption)</text><text x="462" y="112" font-size="11.5" fill="var(--cds-text-secondary)">after 3 denials a robot parks in a bay</text><text x="462" y="130" font-size="11.5" fill="var(--cds-text-secondary)">starter kit; sanction flagged by F1</text></g><g><rect x="450" y="160" width="290" height="72" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="462" y="182" font-weight="600" fill="var(--cds-text-primary)">Prevent the cycle (circular wait)</text><text x="462" y="202" font-size="11.5" fill="var(--cds-text-secondary)">a traffic norm admits one direction</text><text x="462" y="220" font-size="11.5" fill="var(--cds-text-secondary)">at a time (experiment E6)</text></g><g><rect x="450" y="250" width="290" height="72" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="462" y="272" font-weight="600" fill="var(--cds-text-primary)">Detect and recover (preemption)</text><text x="462" y="292" font-size="11.5" fill="var(--cds-text-secondary)">a supervisor detects the cycle and</text><text x="462" y="310" font-size="11.5" fill="var(--cds-text-secondary)">withdraws one robot; requires a free bay</text></g></svg>
