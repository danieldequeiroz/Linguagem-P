(--cds-chart-axis)" stroke-width="1.25"></rect><text x="582" y="287" font-weight="600" fill="var(--cds-text-primary)">A · robot 1 asks</text><text x="582" y="304" font-size="11.5" fill="var(--cds-text-secondary)">denied: safe</text></g><text x="20" y="350" font-size="11.5" fill="var(--cds-text-secondary)">The two-phase protocol removes both unsafe branches: zone 1 denies and drains before the commit, so the picker always finds it empty.</text></svg>
