<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 272" role="img" aria-label="F1 verdict in the two possible orders of ABANDON and SANCTION" font-size="13"><style>svg{--cds-text-primary:#0b0b0b;--cds-text-secondary:#52514e;--cds-chart-axis:#b5b4a8;--cds-chart-grid:#e1e0db;--cds-chart-reference-tint:#ededec;--cds-chart-categorical-1:#2a78d6;--cds-chart-categorical-2:#d9822b;--cds-chart-categorical-3:#7d5bc6;--cds-chart-status-warning:#e8a317;--cds-chart-status-good:#2e9d5b;--cds-chart-status-critical:#d14343;--cds-bg:#ffffff;background:var(--cds-bg);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}@media (prefers-color-scheme:dark){svg{--cds-text-primary:#ecebe7;--cds-text-secondary:#a8a49c;--cds-chart-axis:#6f6d65;--cds-chart-grid:#3a3833;--cds-chart-reference-tint:#2a2926;--cds-chart-categorical-1:#6aa5f0;--cds-chart-categorical-2:#f0a35e;--cds-chart-categorical-3:#a98cf0;--cds-chart-status-warning:#f0b23a;--cds-chart-status-good:#4cc27b;--cds-chart-status-critical:#f06a6a;--cds-bg:#1b1a18}}</style><text x="20" y="26" font-size="15" font-weight="600" fill="var(--cds-text-primary)">F1 depends on the order of ABANDON and SANCTION</text><text x="20" y="64" font-size="12.5" font-weight="600" fill="var(--cds-text-secondary)">Order 1: abandonment before the deadline</text><line x1="40" x2="560" y1="100" y2="100" stroke="var(--cds-chart-axis)" stroke-width="1.5"></line><g><circle cx="80" cy="100" r="6" fill="var(--cds-text-primary)"></circle><text x="80" y="86" font-size="11.5" text-anchor="middle" fill="var(--cds-text-primary)">OBLIGATION 0</text></g><g><circle cx="200" cy="100" r="6" fill="var(--cds-text-primary)"></circle><text x="200" y="86" font-size="11.5" text-anchor="middle" fill="var(--cds-text-primary)">3 denials</text></g><g><circle cx="310" cy="100" r="6" fill="var(--cds-text-primary)"></circle><text x="310" y="86" font-size="11.5" text-anchor="middle" fill="var(--cds-text-primary)">ABANDON 0</text></g><g><circle cx="420" cy="100" r="6" fill="var(--cds-text-primary)"></circle><text x="420" y="86" font-size="11.5" text-anchor="middle" fill="var(--cds-text-primary)">deadline</text></g><g><circle cx="530" cy="100" r="6" fill="var(--cds-chart-categorical-1)"></circle><text x="530" y="86" font-size="11.5" font-weight="600" text-anchor="middle" fill="var(--cds-chart-categorical-1)">SANCTION 0</text></g><g><rect x="578" y="84" width="168" height="34" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.14" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="662" y="106" font-size="11.5" font-weight="600" text-anchor="middle" fill="var(--cds-text-primary)">F1 flags obligation 0</text></g><text x="20" y="154" font-size="12.5" font-weight="600" fill="var(--cds-text-secondary)">Order 2: deadline while the robot still retries</text><line x1="40" x2="560" y1="190" y2="190" stroke="var(--cds-chart-axis)" stroke-width="1.5"></line><g><circle cx="80" cy="190" r="6" fill="var(--cds-text-primary)"></circle><text x="80" y="176" font-size="11.5" text-anchor="middle" fill="var(--cds-text-primary)">OBLIGATION 0</text></g><g><circle cx="200" cy="190" r="6" fill="var(--cds-text-primary)"></circle><text x="200" y="176" font-size="11.5" text-anchor="middle" fill="var(--cds-text-primary)">2 denials</text></g><g><circle cx="310" cy="190" r="6" fill="var(--cds-text-primary)"></circle><text x="310" y="176" font-size="11.5" text-anchor="middle" fill="var(--cds-text-primary)">deadline</text></g><g><circle cx="420" cy="190" r="6" fill="var(--cds-text-primary)"></circle><text x="420" y="176" font-size="11.5" text-anchor="middle" fill="var(--cds-text-primary)">SANCTION 0</text></g><g><circle cx="530" cy="190" r="6" fill="var(--cds-text-primary)"></circle><text x="530" y="176" font-size="11.5" text-anchor="middle" fill="var(--cds-text-primary)">ABANDON 0</text></g><g><rect x="578" y="174" width="168" height="34" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-dasharray="4 3"></rect><text x="662" y="196" font-size="11.5" font-weight="600" text-anchor="middle" fill="var(--cds-text-primary)">F1 silent: false negative</text></g><text x="20" y="240" font-size="11.5" fill="var(--cds-text-secondary)">At run time, ABANDON is logged by the robot node and SANCTION by the fleet manager, with different clocks:</text><text x="20" y="258" font-size="11.5" fill="var(--cds-text-secondary)">clock skew can swap the two lines and change the verdict. A robust monitor correlates on the obligation id in both orders.</text></svg>
