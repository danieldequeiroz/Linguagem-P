<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-label="Admission is distributed; adaptation and sanctioning are centralized" font-size="13"><style>svg{--cds-text-primary:#0b0b0b;--cds-text-secondary:#52514e;--cds-chart-axis:#b5b4a8;--cds-chart-grid:#e1e0db;--cds-chart-reference-tint:#ededec;--cds-chart-categorical-1:#2a78d6;--cds-chart-categorical-2:#d9822b;--cds-chart-categorical-3:#7d5bc6;--cds-chart-status-warning:#e8a317;--cds-chart-status-good:#2e9d5b;--cds-chart-status-critical:#d14343;--cds-bg:#ffffff;background:var(--cds-bg);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}@media (prefers-color-scheme:dark){svg{--cds-text-primary:#ecebe7;--cds-text-secondary:#a8a49c;--cds-chart-axis:#6f6d65;--cds-chart-grid:#3a3833;--cds-chart-reference-tint:#2a2926;--cds-chart-categorical-1:#6aa5f0;--cds-chart-categorical-2:#f0a35e;--cds-chart-categorical-3:#a98cf0;--cds-chart-status-warning:#f0b23a;--cds-chart-status-good:#4cc27b;--cds-chart-status-critical:#f06a6a;--cds-bg:#1b1a18}}</style><text x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Admission is distributed; adaptation and sanctioning are centralized</text><text x="488" y="52" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--cds-text-secondary)">Architectural style</text><text x="24" y="76" font-size="11.5" font-weight="600" fill="var(--cds-text-secondary)">MAOP view</text><text x="360" y="76" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Centralized</text><text x="616" y="76" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Distributed</text><g><text x="24" y="124" fill="var(--cds-text-primary)">Agent-centric</text><rect x="240" y="92" width="240" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-grid)" stroke-width="1.25"></rect><rect x="496" y="92" width="240" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-grid)" stroke-width="1.25"></rect><text x="256" y="116" font-size="11.5" fill="var(--cds-text-secondary)">none in the baseline: the robots are</text><text x="256" y="134" font-size="11.5" fill="var(--cds-text-secondary)">regulated agents; parking is compliance</text></g><g><text x="24" y="188" fill="var(--cds-text-primary)">Environment-centric</text><rect x="240" y="156" width="240" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-grid)" stroke-width="1.25"></rect><rect x="496" y="156" width="240" height="56" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="512" y="180" font-weight="600" fill="var(--cds-text-primary)">3 zone controllers</text><text x="512" y="198" font-size="11.5" fill="var(--cds-text-primary)">regiment entry, zone by zone</text></g><g><text x="24" y="252" fill="var(--cds-text-primary)">Interaction-centric</text><rect x="240" y="220" width="240" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-grid)" stroke-width="1.25"></rect><rect x="496" y="220" width="240" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-grid)" stroke-width="1.25"></rect></g><g><text x="24" y="316" fill="var(--cds-text-primary)">Organization-centric</text><rect x="240" y="284" width="240" height="56" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><rect x="496" y="284" width="240" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-grid)" stroke-width="1.25"></rect><text x="256" y="308" font-weight="600" fill="var(--cds-text-primary)">Fleet manager + coordinator</text><text x="256" y="326" font-size="11.5" fill="var(--cds-text-primary)">sanction and adapt the norms</text></g><text x="24" y="372" font-size="11.5" fill="var(--cds-text-secondary)">A teaching adaptation of the unified view of Yan et al. (COINE 2025); the paper&#x27;s own classification</text><text x="24" y="390" font-size="11.5" fill="var(--cds-text-secondary)">uses organization-, agent- and hybrid-centric views and three architectural styles (Section 4).</text></svg>
