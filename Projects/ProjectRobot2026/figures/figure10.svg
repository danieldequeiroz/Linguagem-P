<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 248" role="img" aria-label="Deadline, grace tick and R1" font-size="13"><style>svg{--cds-text-primary:#0b0b0b;--cds-text-secondary:#52514e;--cds-chart-axis:#b5b4a8;--cds-chart-grid:#e1e0db;--cds-chart-reference-tint:#ededec;--cds-chart-categorical-1:#2a78d6;--cds-chart-categorical-2:#d9822b;--cds-chart-categorical-3:#7d5bc6;--cds-chart-status-warning:#e8a317;--cds-chart-status-good:#2e9d5b;--cds-chart-status-critical:#d14343;--cds-bg:#ffffff;background:var(--cds-bg);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}@media (prefers-color-scheme:dark){svg{--cds-text-primary:#ecebe7;--cds-text-secondary:#a8a49c;--cds-chart-axis:#6f6d65;--cds-chart-grid:#3a3833;--cds-chart-reference-tint:#2a2926;--cds-chart-categorical-1:#6aa5f0;--cds-chart-categorical-2:#f0a35e;--cds-chart-categorical-3:#a98cf0;--cds-chart-status-warning:#f0b23a;--cds-chart-status-good:#4cc27b;--cds-chart-status-critical:#f06a6a;--cds-bg:#1b1a18}}</style><text x="20" y="26" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Deadline, grace tick and the bounded-response monitor R1</text><line x1="60" x2="720" y1="110" y2="110" stroke="var(--cds-chart-axis)" stroke-width="1.5"></line><line x1="100" x2="100" y1="104" y2="116" stroke="var(--cds-chart-axis)" stroke-width="1.5"></line><text x="100" y="134" font-size="12" font-weight="600" text-anchor="middle" fill="var(--cds-text-primary)">t₀</text><line x1="340" x2="340" y1="104" y2="116" stroke="var(--cds-chart-axis)" stroke-width="1.5"></line><text x="340" y="134" font-size="12" font-weight="600" text-anchor="middle" fill="var(--cds-text-primary)">d = Due</text><line x1="480" x2="480" y1="104" y2="116" stroke="var(--cds-chart-axis)" stroke-width="1.5"></line><text x="480" y="134" font-size="12" font-weight="600" text-anchor="middle" fill="var(--cds-text-primary)">d + 1</text><line x1="620" x2="620" y1="104" y2="116" stroke="var(--cds-chart-axis)" stroke-width="1.5"></line><text x="620" y="134" font-size="12" font-weight="600" text-anchor="middle" fill="var(--cds-text-primary)">d + 2</text><g><rect x="100" y="78" width="240" height="22" rx="4" fill="var(--cds-chart-categorical-1)" fill-opacity="0.14" stroke="var(--cds-chart-categorical-1)"></rect><rect x="340" y="78" width="140" height="22" rx="4" fill="var(--cds-text-secondary)" fill-opacity="0.18" stroke="var(--cds-chart-axis)"></rect><rect x="480" y="78" width="140" height="22" rx="4" fill="none" stroke="var(--cds-chart-axis)" stroke-dasharray="4 3"></rect></g><text x="220" y="93" font-size="11.5" text-anchor="middle" fill="var(--cds-text-primary)">report on time: fulfilled</text><text x="410" y="93" font-size="11.5" text-anchor="middle" fill="var(--cds-text-primary)">grace: sanction expected</text><text x="550" y="93" font-size="11.5" text-anchor="middle" fill="var(--cds-text-primary)">still unresolved</text><g><circle cx="100" cy="110" r="6" fill="var(--cds-text-primary)"></circle><circle cx="480" cy="110" r="6" fill="var(--cds-text-primary)"></circle><circle cx="620" cy="110" r="7" fill="var(--cds-chart-categorical-1)"></circle></g><text x="100" y="64" font-size="11.5" text-anchor="middle" fill="var(--cds-text-secondary)">OBLIGATION (Due = d)</text><text x="480" y="166" font-size="11.5" text-anchor="middle" fill="var(--cds-text-primary)">first TICK with now &gt; Due:</text><text x="480" y="183" font-size="11.5" text-anchor="middle" fill="var(--cds-text-primary)">the fleet manager logs SANCTION</text><text x="480" y="200" font-size="11.5" text-anchor="middle" fill="var(--cds-text-primary)">after this TICK</text><text x="640" y="166" font-size="11.5" font-weight="600" text-anchor="middle" fill="var(--cds-chart-categorical-1)">R1 assertion fails</text><text x="640" y="183" font-size="11.5" text-anchor="middle" fill="var(--cds-text-secondary)">if the obligation is</text><text x="640" y="200" font-size="11.5" text-anchor="middle" fill="var(--cds-text-secondary)">still open at d + 2</text><text x="20" y="236" font-size="11.5" fill="var(--cds-text-secondary)">R1 checks G(created → F≤(Due+1) resolved): one tick of grace absorbs the order TICK → SANCTION within a tick.</text></svg>
