<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Conditions for sanctioning a missed deadline" font-size="13"><style>svg{--cds-text-primary:#0b0b0b;--cds-text-secondary:#52514e;--cds-chart-axis:#b5b4a8;--cds-chart-grid:#e1e0db;--cds-chart-reference-tint:#ededec;--cds-chart-categorical-1:#2a78d6;--cds-chart-categorical-2:#d9822b;--cds-chart-categorical-3:#7d5bc6;--cds-chart-status-warning:#e8a317;--cds-chart-status-good:#2e9d5b;--cds-chart-status-critical:#d14343;--cds-bg:#ffffff;background:var(--cds-bg);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}@media (prefers-color-scheme:dark){svg{--cds-text-primary:#ecebe7;--cds-text-secondary:#a8a49c;--cds-chart-axis:#6f6d65;--cds-chart-grid:#3a3833;--cds-chart-reference-tint:#2a2926;--cds-chart-categorical-1:#6aa5f0;--cds-chart-categorical-2:#f0a35e;--cds-chart-categorical-3:#a98cf0;--cds-chart-status-warning:#f0b23a;--cds-chart-status-good:#4cc27b;--cds-chart-status-critical:#f06a6a;--cds-bg:#1b1a18}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="20" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Conditions for sanctioning a missed deadline</text><g><rect x="20" y="70" width="130" height="56" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="32" y="94" font-weight="600" fill="var(--cds-text-primary)">Deadline</text><text x="32" y="112" font-size="11.5" fill="var(--cds-text-secondary)">missed</text></g><g><rect x="190" y="70" width="180" height="56" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="202" y="94" font-weight="600" fill="var(--cds-text-primary)">Denied by a zone</text><text x="202" y="112" font-size="11.5" fill="var(--cds-text-secondary)">controller meanwhile?</text></g><g><rect x="410" y="70" width="180" height="56" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="422" y="94" font-weight="600" fill="var(--cds-text-primary)">Waiting for a zone</text><text x="422" y="112" font-size="11.5" fill="var(--cds-text-secondary)">held by another robot?</text></g><g><rect x="630" y="70" width="110" height="56" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.14" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="642" y="94" font-weight="600" fill="var(--cds-text-primary)">Sanction</text><text x="642" y="112" font-size="11.5" fill="var(--cds-text-primary)">non-compliance</text></g><g><rect x="190" y="190" width="180" height="56" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="202" y="214" font-weight="600" fill="var(--cds-text-primary)">Excuse</text><text x="202" y="232" font-size="11.5" fill="var(--cds-text-secondary)">delay caused by regulation</text></g><g><rect x="410" y="190" width="180" height="56" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="422" y="214" font-weight="600" fill="var(--cds-text-primary)">Excuse or replan</text><text x="422" y="232" font-size="11.5" fill="var(--cds-text-secondary)">delay caused by traffic</text></g><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#ah)"><path d="M150 98H188"></path><path d="M370 98H408"></path><path d="M590 98H628"></path><path d="M280 126V188"></path><path d="M500 126V188"></path></g><text x="389" y="90" font-size="11.5" text-anchor="middle" fill="var(--cds-text-secondary)">no</text><text x="609" y="90" font-size="11.5" text-anchor="middle" fill="var(--cds-text-secondary)">no</text><text x="288" y="162" font-size="11.5" fill="var(--cds-text-secondary)">yes</text><text x="508" y="162" font-size="11.5" fill="var(--cds-text-secondary)">yes</text><text x="20" y="276" font-size="11.5" fill="var(--cds-text-secondary)">F1 approximates both excuse branches together: it flags a sanction on an obligation abandoned after</text><text x="20" y="293" font-size="11.5" fill="var(--cds-text-secondary)">repeated denials, but does not distinguish regulation from traffic as the cause of the denials.</text></svg>
