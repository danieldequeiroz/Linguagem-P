<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" role="img" aria-label="JaCaMo gives each MAOP dimension its own technology" font-size="13"><style>svg{--cds-text-primary:#0b0b0b;--cds-text-secondary:#52514e;--cds-chart-axis:#b5b4a8;--cds-chart-grid:#e1e0db;--cds-chart-reference-tint:#ededec;--cds-chart-categorical-1:#2a78d6;--cds-chart-categorical-2:#d9822b;--cds-chart-categorical-3:#7d5bc6;--cds-chart-status-warning:#e8a317;--cds-chart-status-good:#2e9d5b;--cds-chart-status-critical:#d14343;--cds-bg:#ffffff;background:var(--cds-bg);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}@media (prefers-color-scheme:dark){svg{--cds-text-primary:#ecebe7;--cds-text-secondary:#a8a49c;--cds-chart-axis:#6f6d65;--cds-chart-grid:#3a3833;--cds-chart-reference-tint:#2a2926;--cds-chart-categorical-1:#6aa5f0;--cds-chart-categorical-2:#f0a35e;--cds-chart-categorical-3:#a98cf0;--cds-chart-status-warning:#f0b23a;--cds-chart-status-good:#4cc27b;--cds-chart-status-critical:#f06a6a;--cds-bg:#1b1a18}}</style><defs><marker id="maop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="var(--cds-text-primary)">JaCaMo gives each MAOP dimension its own technology</text><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M200 116V156" marker-start="url(#maop-arrow)" marker-end="url(#maop-arrow)"></path><path d="M200 220V260" marker-start="url(#maop-arrow)" marker-end="url(#maop-arrow)"></path><path d="M200 324V364" marker-start="url(#maop-arrow)" marker-end="url(#maop-arrow)"></path><path d="M600 84H616"></path><path d="M600 188H616"></path><path d="M600 292H616"></path></g><text x="208" y="140" font-size="11.5" fill="var(--cds-text-secondary)">adopt roles, commit to missions / obligations</text><text x="208" y="244" font-size="11.5" fill="var(--cds-text-secondary)">operations on artifacts / percepts</text><text x="208" y="348" font-size="11.5" fill="var(--cds-text-secondary)">commands / sensor data</text><g><rect x="24" y="52" width="576" height="64" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="40" y="78" font-weight="600" fill="var(--cds-text-primary)">Organization</text><text x="40" y="98" font-size="11.5" fill="var(--cds-text-secondary)">Moise + NPL</text><text x="330" y="78" font-size="11.5" fill="var(--cds-text-primary)">delivery obligations, deadlines;</text><text x="330" y="98" font-size="11.5" fill="var(--cds-text-primary)">who may request a closure</text></g><g><rect x="24" y="156" width="576" height="64" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="40" y="182" font-weight="600" fill="var(--cds-text-primary)">Agents</text><text x="40" y="202" font-size="11.5" fill="var(--cds-text-secondary)">Jason (BDI)</text><text x="330" y="182" font-size="11.5" fill="var(--cds-text-primary)">robot 1, robot 2</text><text x="330" y="202" font-size="11.5" fill="var(--cds-text-primary)">move, park, report</text></g><g><rect x="24" y="260" width="576" height="64" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="40" y="286" font-weight="600" fill="var(--cds-text-primary)">Environment</text><text x="40" y="306" font-size="11.5" fill="var(--cds-text-secondary)">CArtAgO artifacts</text><text x="330" y="286" font-size="11.5" fill="var(--cds-text-primary)">3 zone controller artifacts</text><text x="330" y="306" font-size="11.5" fill="var(--cds-text-primary)">admit or refuse entry</text></g><g><rect x="24" y="364" width="576" height="64" rx="8" fill="var(--cds-chart-reference-tint)" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="40" y="390" font-weight="600" fill="var(--cds-text-primary)">Physical layer</text><text x="40" y="410" font-size="11.5" fill="var(--cds-text-secondary)">outside the MAS</text><text x="330" y="390" font-size="11.5" fill="var(--cds-text-primary)">ROS 2 nodes, robots,</text><text x="330" y="410" font-size="11.5" fill="var(--cds-text-primary)">light curtains</text></g><g><rect x="616" y="52" width="120" height="272" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="628" y="78" font-weight="600" fill="var(--cds-text-primary)">Interaction</text><text x="628" y="98" font-size="11.5" fill="var(--cds-text-secondary)">messages and</text><text x="628" y="114" font-size="11.5" fill="var(--cds-text-secondary)">protocols:</text><text x="628" y="130" font-size="11.5" fill="var(--cds-text-secondary)">speech acts,</text><text x="628" y="146" font-size="11.5" fill="var(--cds-text-secondary)">Contract Net,</text><text x="628" y="162" font-size="11.5" fill="var(--cds-text-secondary)">prepare, ack,</text><text x="628" y="178" font-size="11.5" fill="var(--cds-text-secondary)">commit</text></g></svg>
