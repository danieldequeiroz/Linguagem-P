text-secondary)">announce the</text><text x="38" y="122" font-size="11.5" fill="var(--cds-text-secondary)">maintenance</text></g><g><rect x="146" y="66" width="108" height="66" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="158" y="88" font-weight="600" fill="var(--cds-text-primary)">Shut down</text><text x="158" y="106" font-size="11.5" fill="var(--cds-text-secondary)">stop every</text><text x="158" y="122" font-size="11.5" fill="var(--cds-text-secondary)">machine</text></g><g><rect x="266" y="66" width="108" height="66" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="278" y="88" font-weight="600" fill="var(--cds-text-primary)">Isolate</text><text x="278" y="106" font-size="11.5" fill="var(--cds-text-secondary)">cut energy</text><text x="278" y="122" font-size="11.5" fill="var(--cds-text-secondary)">sources</text></g><g><rect x="386" y="66" width="108" height="66" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="398" y="88" font-weight="600" fill="var(--cds-text-primary)">Lock and tag</text><text x="398" y="106" font-size="11.5" fill="var(--cds-text-secondary)">personal lock</text><text x="398" y="122" font-size="11.5" fill="var(--cds-text-secondary)">on each source</text></g><g><rect x="506" y="66" width="108" height="66" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="518" y="88" font-weight="600" fill="var(--cds-text-primary)">Verify</text><text x="518" y="106" font-size="11.5" fill="var(--cds-text-secondary)">try to start;</text><text x="518" y="122" font-size="11.5" fill="var(--cds-text-secondary)">nothing moves</text></g><g><rect x="626" y="66" width="108" height="66" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="638" y="88" font-weight="600" fill="var(--cds-text-primary)">Work, remove</