rt-axis)" stroke-width="1.25"></rect><text x="518" y="220" font-weight="600" fill="var(--cds-text-primary)">Monitor</text><text x="518" y="238" font-size="11.5" fill="var(--cds-text-secondary)">S1 and R3</text><text x="518" y="254" font-size="11.5" fill="var(--cds-text-secondary)">must hold</text></g><g><rect x="626" y="198" width="108" height="66" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="638" y="220" font-weight="600" fill="var(--cds-text-primary)">Reopen</text><text x="638" y="238" font-size="11.5" fill="var(--cds-text-secondary)">reverse</text><text x="638" y="254" font-size="11.5" fill="var(--cds-text-secondary)">adaptation</text></g></svg>
