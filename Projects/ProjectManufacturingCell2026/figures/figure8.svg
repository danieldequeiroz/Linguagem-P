<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 432" role="img" aria-label="Enforcement mechanism by cost and controllability" font-size="13"><style>svg{--cds-text-primary:#0b0b0b;--cds-text-secondary:#52514e;--cds-chart-axis:#b5b4a8;--cds-chart-grid:#e1e0db;--cds-chart-reference-tint:#ededec;--cds-chart-categorical-1:#2a78d6;--cds-chart-categorical-2:#d9822b;--cds-chart-categorical-3:#7d5bc6;--cds-chart-status-warning:#e8a317;--cds-chart-status-good:#2e9d5b;--cds-chart-status-critical:#d14343;--cds-bg:#ffffff;background:var(--cds-bg);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}@media (prefers-color-scheme:dark){svg{--cds-text-primary:#ecebe7;--cds-text-secondary:#a8a49c;--cds-chart-axis:#6f6d65;--cds-chart-grid:#3a3833;--cds-chart-reference-tint:#2a2926;--cds-chart-categorical-1:#6aa5f0;--cds-chart-categorical-2:#f0a35e;--cds-chart-categorical-3:#a98cf0;--cds-chart-status-warning:#f0b23a;--cds-chart-status-good:#4cc27b;--cds-chart-status-critical:#f06a6a;--cds-bg:#1b1a18}}</style><text x="24" y="30" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Enforcement mechanism by cost and controllability</text><g><rect x="410" y="60" width="290" height="160" fill="var(--cds-chart-categorical-1)" fill-opacity="0.08"></rect><rect x="120" y="60" width="580" height="320" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><line x1="410" x2="410" y1="60" y2="380" stroke="var(--cds-chart-grid)" stroke-width="1.25"></line><line x1="120" x2="700" y1="220" y2="220" stroke="var(--cds-chart-grid)" stroke-width="1.25"></line></g><text x="128" y="80" font-size="11.5" font-weight="600" fill="var(--cds-text-secondary)">Monitor, plus a safety layer below the MAS</text><text x="692" y="80" text-anchor="end" font-size="11.5" font-weight="600" fill="var(--cds-chart-categorical-1)">Regiment</text><text x="128" y="370" font-size="11.5" font-weight="600" fill="var(--cds-text-secondary)">Sanction</text><text x="692" y="370" text-anchor="end" font-size="11.5" font-weight="600" fill="var(--cds-text-secondary)">Regiment or sanction: a design choice</text><g><circle cx="500" cy="130" r="6" fill="var(--cds-text-primary)"></circle><text x="512" y="134" fill="var(--cds-text-primary)">Envelope capacity</text></g><g><circle cx="500" cy="170" r="6" fill="var(--cds-text-primary)"></circle><text x="512" y="174" fill="var(--cds-text-primary)">No agent with a person</text></g><g><circle cx="200" cy="150" r="6" fill="var(--cds-text-primary)"></circle><text x="212" y="154" fill="var(--cds-text-primary)">Lock-out before entry</text></g><g><circle cx="200" cy="300" r="6" fill="var(--cds-text-primary)"></circle><text x="212" y="304" fill="var(--cds-text-primary)">Job deadline</text></g><g><text x="410" y="420" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--cds-text-secondary)">Can the environment block the action?</text><text x="120" y="398" font-size="11.5" fill="var(--cds-text-secondary)">no</text><text x="700" y="398" text-anchor="end" font-size="11.5" fill="var(--cds-text-secondary)">yes</text><text x="92" y="220" text-anchor="middle" transform="rotate(-90 92 220)" font-size="11.5" font-weight="600" fill="var(--cds-text-secondary)">Cost of one violation</text><text x="112" y="72" text-anchor="end" font-size="11.5" fill="var(--cds-text-secondary)">high</text><text x="112" y="380" text-anchor="end" font-size="11.5" fill="var(--cds-text-secondary)">low</text></g></svg>
