<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 428" role="img" aria-label="Manufacturing cell: why closure needs a drain phase" font-size="13"><style>svg{--cds-text-primary:#0b0b0b;--cds-text-secondary:#52514e;--cds-chart-axis:#b5b4a8;--cds-chart-grid:#e1e0db;--cds-chart-reference-tint:#ededec;--cds-chart-categorical-1:#2a78d6;--cds-chart-categorical-2:#d9822b;--cds-chart-categorical-3:#7d5bc6;--cds-chart-status-warning:#e8a317;--cds-chart-status-good:#2e9d5b;--cds-chart-status-critical:#d14343;--cds-bg:#ffffff;background:var(--cds-bg);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}@media (prefers-color-scheme:dark){svg{--cds-text-primary:#ecebe7;--cds-text-secondary:#a8a49c;--cds-chart-axis:#6f6d65;--cds-chart-grid:#3a3833;--cds-chart-reference-tint:#2a2926;--cds-chart-categorical-1:#6aa5f0;--cds-chart-categorical-2:#f0a35e;--cds-chart-categorical-3:#a98cf0;--cds-chart-status-warning:#f0b23a;--cds-chart-status-good:#4cc27b;--cds-chart-status-critical:#f06a6a;--cds-bg:#1b1a18}}</style><g transform="scale(0.475) translate(0 -40)"><defs><marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cds-chart-status-good)"></path></marker><marker id="arrow-critical" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cds-chart-status-critical)"></path></marker></defs><text x="60" y="111" fill="var(--cds-text-primary)" font-size="39" font-weight="700">Manufacturing cell: why closure needs a drain phase</text><text x="60" y="156" fill="var(--cds-text-secondary)" font-size="23">One possible unsafe execution compared with the intended safe sequence</text><rect x="60" y="210" width="720" height="590" rx="16" fill="var(--cds-chart-status-critical)" fill-opacity="0.05" stroke="var(--cds-chart-status-critical)" stroke-width="2"></rect><rect x="820" y="210" width="720" height="590" rx="16" fill="var(--cds-chart-status-good)" fill-opacity="0.05" stroke="var(--cds-chart-status-good)" stroke-width="2"></rect><text x="95" y="263" fill="var(--cds-chart-status-critical)" font-size="27" font-weight="700">NAIVE ADAPTATION</text><text x="855" y="263" fill="var(--cds-chart-status-good)" font-size="27" font-weight="700">PREPARE–DRAIN–COMMIT</text><text x="95" y="302" fill="var(--cds-text-secondary)" font-size="22">Declare first; install later</text><text x="855" y="302" fill="var(--cds-text-secondary)" font-size="22">Stop admission; establish emptiness first</text><rect x="105" y="340" width="630" height="76" rx="12" fill="none" stroke="var(--cds-chart-status-critical)" stroke-width="2"></rect><text x="128" y="387" fill="var(--cds-text-primary)" font-size="24">Coordinator declares the resource closed</text><path d="M420,420 L420,445" fill="none" stroke="var(--cds-chart-status-critical)" stroke-width="3" marker-end="url(#arrow-critical)"></path><rect x="105" y="454" width="630" height="76" rx="12" fill="none" stroke="var(--cds-chart-status-critical)" stroke-width="2"></rect><text x="128" y="501" fill="var(--cds-text-primary)" font-size="24">Person enters after notification</text><path d="M420,534 L420,559" fill="none" stroke="var(--cds-chart-status-critical)" stroke-width="3" marker-end="url(#arrow-critical)"></path><rect x="105" y="568" width="630" height="76" rx="12" fill="none" stroke="var(--cds-chart-status-critical)" stroke-width="2"></rect><text x="128" y="615" fill="var(--cds-text-primary)" font-size="24">Old-version controller admits an agent</text><rect x="865" y="340" width="630" height="70" rx="12" fill="none" stroke="var(--cds-chart-status-good)" stroke-width="2"></rect><text x="888" y="384" fill="var(--cds-text-primary)" font-size="24">Affected controller blocks new entries</text><path d="M1180,414 L1180,430" fill="none" stroke="var(--cds-chart-status-good)" stroke-width="3" marker-end="url(#arrow-good)"></path><rect x="865" y="438" width="630" height="70" rx="12" fill="none" stroke="var(--cds-chart-status-good)" stroke-width="2"></rect><text x="888" y="482" fill="var(--cds-text-primary)" font-size="24">Controller drains the occupied resource</text><path d="M1180,512 L1180,528" fill="none" stroke="var(--cds-chart-status-good)" stroke-width="3" marker-end="url(#arrow-good)"></path><rect x="865" y="536" width="630" height="70" rx="12" fill="none" stroke="var(--cds-chart-status-good)" stroke-width="2"></rect><text x="888" y="580" fill="var(--cds-text-primary)" font-size="24">Coordinator commits the closure</text><path d="M1180,610 L1180,626" fill="none" stroke="var(--cds-chart-status-good)" stroke-width="3" marker-end="url(#arrow-good)"></path><rect x="865" y="634" width="630" height="70" rx="12" fill="none" stroke="var(--cds-chart-status-good)" stroke-width="2"></rect><text x="888" y="678" fill="var(--cds-text-primary)" font-size="24">Person enters after notification</text><text x="420" y="745" fill="var(--cds-chart-status-critical)" font-size="24" font-weight="700" text-anchor="middle">POSSIBLE HUMAN–AGENT OVERLAP</text><text x="1180" y="782" fill="var(--cds-chart-status-good)" font-size="23" font-weight="700" text-anchor="middle">CLOSED + EMPTY BEFORE HUMAN ENTRY</text><path d="M60,848 H1540" stroke="var(--cds-chart-axis)" stroke-width="2"></path><text x="60" y="886" fill="var(--cds-text-secondary)" font-size="22">Safety concerns admission and occupancy during the change. Liveness asks whether closure completes; progress depends on</text><text x="60" y="914" fill="var(--cds-text-secondary)" font-size="22">agents eventually releasing the work envelope.</text></g></svg>
