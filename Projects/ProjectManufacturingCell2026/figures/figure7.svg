<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 308" role="img" aria-label="Temporal and deontic box operators compared" font-size="13"><style>svg{--cds-text-primary:#0b0b0b;--cds-text-secondary:#52514e;--cds-chart-axis:#b5b4a8;--cds-chart-grid:#e1e0db;--cds-chart-reference-tint:#ededec;--cds-chart-categorical-1:#2a78d6;--cds-chart-categorical-2:#d9822b;--cds-chart-categorical-3:#7d5bc6;--cds-chart-status-warning:#e8a317;--cds-chart-status-good:#2e9d5b;--cds-chart-status-critical:#d14343;--cds-bg:#ffffff;background:var(--cds-bg);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}@media (prefers-color-scheme:dark){svg{--cds-text-primary:#ecebe7;--cds-text-secondary:#a8a49c;--cds-chart-axis:#6f6d65;--cds-chart-grid:#3a3833;--cds-chart-reference-tint:#2a2926;--cds-chart-categorical-1:#6aa5f0;--cds-chart-categorical-2:#f0a35e;--cds-chart-categorical-3:#a98cf0;--cds-chart-status-warning:#f0b23a;--cds-chart-status-good:#4cc27b;--cds-chart-status-critical:#f06a6a;--cds-bg:#1b1a18}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="20" y="26" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Box operators in temporal and deontic logic</text><text x="20" y="58" font-size="12" font-weight="600" fill="var(--cds-text-secondary)">Temporal: G quantifies over the points of a run</text><text x="410" y="58" font-size="12" font-weight="600" fill="var(--cds-text-secondary)">Deontic: O quantifies over ideal worlds</text><line x1="390" x2="390" y1="44" y2="300" stroke="var(--cds-chart-axis)" stroke-opacity="0.5"></line><g><circle cx="50" cy="150" r="20" fill="none" stroke="var(--cds-text-primary)" stroke-width="1.5"></circle><text x="50" y="155" font-size="13" font-weight="600" text-anchor="middle" fill="var(--cds-text-primary)">φ</text></g><g><circle cx="130" cy="150" r="20" fill="none" stroke="var(--cds-text-primary)" stroke-width="1.5"></circle><text x="130" y="155" font-size="13" font-weight="600" text-anchor="middle" fill="var(--cds-text-primary)">φ</text></g><g><circle cx="210" cy="150" r="20" fill="none" stroke="var(--cds-text-primary)" stroke-width="1.5"></circle><text x="210" y="155" font-size="13" font-weight="600" text-anchor="middle" fill="var(--cds-text-primary)">φ</text></g><g><circle cx="290" cy="150" r="20" fill="none" stroke="var(--cds-text-primary)" stroke-width="1.5"></circle><text x="290" y="155" font-size="13" font-weight="600" text-anchor="middle" fill="var(--cds-text-primary)">φ</text></g><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#ah)"><path d="M70 150H108"></path><path d="M150 150H188"></path><path d="M230 150H268"></path><path d="M310 150H340"></path></g><text x="352" y="155" font-size="14" fill="var(--cds-text-primary)">…</text><text x="50" y="195" font-size="11.5" text-anchor="middle" fill="var(--cds-text-secondary)">now</text><text x="290" y="195" font-size="11.5" text-anchor="middle" fill="var(--cds-text-secondary)">later</text><g><circle cx="450" cy="150" r="20" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="1.5"></circle><text x="450" y="155" font-size="13" font-weight="600" text-anchor="middle" fill="var(--cds-text-primary)">¬φ</text></g><text x="450" y="195" font-size="11.5" text-anchor="middle" fill="var(--cds-text-secondary)">actual world w</text><g><circle cx="650" cy="90" r="20" fill="var(--cds-chart-categorical-1)" fill-opacity="0.14" stroke="var(--cds-chart-categorical-1)" stroke-width="1.5"></circle><text x="650" y="95" font-size="13" font-weight="600" text-anchor="middle" fill="var(--cds-text-primary)">φ</text></g><g><circle cx="650" cy="150" r="20" fill="var(--cds-chart-categorical-1)" fill-opacity="0.14" stroke="var(--cds-chart-categorical-1)" stroke-width="1.5"></circle><text x="650" y="155" font-size="13" font-weight="600" text-anchor="middle" fill="var(--cds-text-primary)">φ</text></g><g><circle cx="650" cy="210" r="20" fill="var(--cds-chart-categorical-1)" fill-opacity="0.14" stroke="var(--cds-chart-categorical-1)" stroke-width="1.5"></circle><text x="650" y="215" font-size="13" font-weight="600" text-anchor="middle" fill="var(--cds-text-primary)">φ</text></g><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#ah)"><path d="M470 144L628 96"></path><path d="M472 150H628"></path><path d="M470 156L628 204"></path></g><rect x="610" y="64" width="80" height="172" rx="10" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-dasharray="4 3"></rect><text x="650" y="256" font-size="11.5" text-anchor="middle" fill="var(--cds-text-secondary)">ideal alternatives</text><text x="20" y="272" font-size="12.5" fill="var(--cds-text-primary)">G φ: φ at every point from now on.</text><text x="20" y="292" font-size="12.5" fill="var(--cds-text-secondary)">A run with ¬φ anywhere refutes it.</text><text x="410" y="272" font-size="12.5" fill="var(--cds-text-primary)">O φ: φ in every ideal alternative of w.</text><text x="410" y="292" font-size="12.5" fill="var(--cds-text-secondary)">w itself may be ¬φ: a violation, not a contradiction.</text></svg>
