<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 326" role="img" aria-label="Monitor automaton for the liveness property L1" font-size="13"><style>svg{--cds-text-primary:#0b0b0b;--cds-text-secondary:#52514e;--cds-chart-axis:#b5b4a8;--cds-chart-grid:#e1e0db;--cds-chart-reference-tint:#ededec;--cds-chart-categorical-1:#2a78d6;--cds-chart-categorical-2:#d9822b;--cds-chart-categorical-3:#7d5bc6;--cds-chart-status-warning:#e8a317;--cds-chart-status-good:#2e9d5b;--cds-chart-status-critical:#d14343;--cds-bg:#ffffff;background:var(--cds-bg);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}@media (prefers-color-scheme:dark){svg{--cds-text-primary:#ecebe7;--cds-text-secondary:#a8a49c;--cds-chart-axis:#6f6d65;--cds-chart-grid:#3a3833;--cds-chart-reference-tint:#2a2926;--cds-chart-categorical-1:#6aa5f0;--cds-chart-categorical-2:#f0a35e;--cds-chart-categorical-3:#a98cf0;--cds-chart-status-warning:#f0b23a;--cds-chart-status-good:#4cc27b;--cds-chart-status-critical:#f06a6a;--cds-bg:#1b1a18}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="20" y="26" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Monitor automaton for L1 (EveryObligationResolved)</text><text x="20" y="52" font-size="12" fill="var(--cds-text-secondary)">G(created(o) → F resolved(o)) for every obligation o, where resolved = fulfilled ∨ sanctioned</text><g><path d="M40 160H113" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#ah)"></path><text x="40" y="150" font-size="11.5" fill="var(--cds-text-secondary)">start</text></g><g><circle cx="170" cy="160" r="55" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.5"></circle><text x="170" y="157" font-size="13" font-weight="600" text-anchor="middle" fill="var(--cds-text-primary)">NoneOpen</text><text x="170" y="176" font-size="11.5" text-anchor="middle" fill="var(--cds-text-secondary)">cold</text></g><g><circle cx="430" cy="160" r="55" fill="var(--cds-chart-categorical-1)" fill-opacity="0.14" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></circle><text x="430" y="157" font-size="13" font-weight="600" text-anchor="middle" fill="var(--cds-text-primary)">SomeOpen</text><text x="430" y="176" font-size="11.5" text-anchor="middle" fill="var(--cds-text-secondary)">hot</text></g><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#ah)"><path d="M215 128C270 75 330 75 385 128"></path><path d="M385 192C330 245 270 245 215 192"></path><path d="M478 135C545 95 545 225 478 185"></path></g><text x="300" y="82" font-size="11.5" text-anchor="middle" fill="var(--cds-text-secondary)">created(o) / add o to pending</text><text x="300" y="262" font-size="11.5" text-anchor="middle" fill="var(--cds-text-secondary)">resolved(o), o last pending / remove o</text><text x="552" y="146" font-size="11.5" fill="var(--cds-text-secondary)">created(o): add o to pending</text><text x="552" y="166" font-size="11.5" fill="var(--cds-text-secondary)">resolved(o), others pending:</text><text x="552" y="184" font-size="11.5" fill="var(--cds-text-secondary)">remove o from pending</text><text x="20" y="296" font-size="12" fill="var(--cds-text-primary)">Cold state: an execution may end here.</text><text x="20" y="314" font-size="12" fill="var(--cds-text-primary)">Hot state: an execution that terminates here, or stays here beyond the liveness threshold, violates L1.</text></svg>
